      background: var(--surface);
      border: 1px solid var(--line);
      color: var(--ink)
    }

    .qa:hover {
      border-color: var(--ink)
    }

    .qa-ic,
    .qa.q2 .qa-ic,
    .qa.q3 .qa-ic,
    .qa.q4 .qa-ic {
      background: var(--line-2);
      color: var(--ink)
    }

    .qa:first-child .qa-ic {
      background: var(--accent);
      color: #111
    }

    /* status boxes on home */
    .stbox {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: .5rem
    }

    .stb {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--r);
      padding: .9rem;
      text-align: left;
      display: flex;
      flex-direction: column;
      gap: .15rem;
      min-width: 0
    }

    .stb:hover {
      border-color: var(--ink)
    }

    .stb-ic {
      width: 2.1rem;
      height: 2.1rem;
      border-radius: var(--r);
      display: grid;
      place-items: center;
      background: var(--info-50);
      color: var(--info);
      margin-bottom: .35rem
    }

    .stb.rd .stb-ic {
      background: var(--success-50);
      color: var(--success)
    }

    .stb .n {
      font-size: 1.9rem;
      font-weight: 750;
      letter-spacing: -.03em;
      line-height: 1.1
    }

    .stb .l {
      font-size: .87rem;
      color: var(--muted);
      font-weight: 500
    }

    /* month card, kpis */
    .mcard .v,
    .kpi .v {
      font-weight: 750
    }

    .kpi {
      padding: .9rem
    }

    /* cards & lists */
    .card,
    .panel,
    .agenda,
    .detail-head,
    .pipe-card,
    .mcard,
    .kpi,
    .tile {
      border-color: var(--line)
    }

    .card:hover,
    .ag:hover {
      background: var(--surface-2)
    }

    .oc-no {
      font-weight: 700;
      color: var(--ink)
    }

    .oc-name {
      font-size: 1.08rem;
      font-weight: 650
    }

    .order-card::before {
      width: 4px
    }

    /* status pill: dot style */
    .pill {
      background: transparent;
      border: 1px solid var(--line);
      color: var(--ink);
      padding: .12rem .5rem .12rem .4rem;
      font-weight: 600
    }

    .pill::before {
      content: "";
      width: .45rem;
      height: .45rem;
      border-radius: 1px;
      background: var(--sc);
      flex-shrink: 0
    }

    /* chips, segments, tabs */
    .chip {
      background: var(--surface);
      color: var(--ink)
    }

    .chip.on,
    .seg button.on,
    .langs button.on,
    .seg2 button.on {
      background: var(--ink);
      border-color: var(--ink);
      color: var(--bg)
    }

    .chip.on .n {
      color: var(--bg);
      opacity: .7
    }

    [data-theme=dark] .chip.on,
    [data-theme=dark] .seg button.on,
    [data-theme=dark] .langs button.on {
      background: var(--accent);
      border-color: var(--accent);
      color: #111
    }

    .stseg button {
      height: 3rem;
      font-weight: 600
    }

    /* buttons */
    .btn-primary {
      background: var(--ink);
      color: var(--bg)
    }

    .btn-primary:hover {
      background: var(--primary-600)
    }

    [data-theme=dark] .btn-primary {
      background: var(--accent);
      color: #111
    }

    .btn-secondary:hover {
      border-color: var(--ink)
    }

    .btn-accent {
      background: var(--accent);
      color: #111
    }

    .ic-n {
      background: var(--ink);
      color: var(--bg)
    }

    [data-theme=dark] .ic-n {
      background: var(--line);
      color: var(--ink)
    }

    .pk-sel {
      border-color: var(--ink);
      background: var(--surface-2)
    }

    .mic {
      background: var(--accent);
      color: #111
    }

    /* bottom nav: ink bar */
    .nav {
      background: var(--nav);
      border-top: 1px solid var(--nav)
    }

    .nav button.tab {
      color: var(--nav-ink)
    }

    .nav button.tab.on {
      color: var(--nav-on)
    }

    .nav button.tab.on .ni {
      background: var(--nav-pill)
    }

    .nav .plus {
      background: var(--accent);
      color: #111
    }

    .nav .badge {
      background: var(--accent);
      color: #111;
      font-weight: 700
    }

    /* more & settings */
    .tile .ic-sq {
      background: var(--line-2);
      color: var(--ink)
    }

    .tile:hover {
      border-color: var(--ink)
    }

    .shop-card .brand-mark {
      background: var(--ink);
      color: var(--accent)
    }

    .setrow .ic-sq {
      background: var(--line-2)
    }

    /* sheets */
    .sheet {
      border-top: 3px solid var(--ink)
    }

    [data-theme=dark] .sheet {
      border-top-color: var(--accent)
    }

    .sheet-head h3 {
      font-weight: 750;
      letter-spacing: -.02em
    }

    .cg .ic-sq {
      background: var(--line-2);
      color: var(--ink)
    }

    .cg:first-child .ic-sq {
      background: var(--accent);
      color: #111
    }

    /* cloth types */
    .glist {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--r)
    }

    .grow {
      display: flex;
      align-items: center;
      gap: .8rem;
      width: 100%;
      text-align: left;
      padding: .85rem .9rem;
      border-bottom: 1px solid var(--line-2);
      border-radius: 0
    }

    .grow:last-child {
      border-bottom: 0
    }

    .grow:hover {
      background: var(--surface-2)
    }

    .g-ic {
      width: 2.6rem;
      height: 2.6rem;
      border-radius: var(--r);
      background: var(--ink);
      color: var(--accent);
      display: grid;
      place-items: center;
      font-weight: 750;
      font-size: 1.15rem;
      flex-shrink: 0
    }

    .g-ic.lg {
      width: 3.4rem;
      height: 3.4rem;
      font-size: 1.5rem
    }

    [data-theme=dark] .g-ic {
      background: var(--accent);
      color: #111
    }

    .ghead {
      display: flex;
      align-items: center;
      gap: .9rem;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--r);
      padding: 1rem
    }

    .more-opt {
      border: 1px solid var(--line);
      border-radius: var(--r);
      padding: .75rem .9rem;
      margin-bottom: .9rem;
      background: var(--surface-2)
    }

    .more-opt summary {
      cursor: pointer;
      font-weight: 600;
      font-size: .95rem
    }

    .more-opt[open] summary {
      margin-bottom: .25rem
    }

    /* =====================================================================
   v7 — "Atelier" design system. Flat. 2–4px radius. No shadows, no gradients.
   ===================================================================== */
    :root {
      --bg: #F5F6F8;
      --surface: #FFFFFF;
      --surface-2: #F9FAFB;
      --ink: #111827;
      --muted: #5B6472;
      --faint: #99A1AD;
      --line: #E3E6EB;
      --line-2: #EEF0F3;
      --primary: #2B4ACB;
      --primary-600: #2340B2;
      --primary-50: #EDF0FC;
      --on-primary: #FFFFFF;
      --accent: #E39A2D;
      --accent-ink: #8A5A12;
      --accent-50: #FDF3E3;
      --danger: #C8372D;
      --danger-50: #FCEDEB;
      --success: #17804A;
      --success-50: #E9F6EF;
      --info: #2563C9;
      --info-50: #EAF1FB;
      --violet: #6D44C9;
      --violet-50: #F2EEFB;
      --c1: #2B4ACB;
      --c2: #D98A1E;
      --r: 4px;
      --r-sm: 2px;
      --ease: cubic-bezier(.2, .8, .2, 1);
      --t-fast: .12s;
      --t: .2s;
      --nav: #FFFFFF;
      --nav-ink: #8A919C;
      --nav-on: #2B4ACB;
      --nav-pill: #EDF0FC;
    }

    [data-theme=dark] {
      --bg: #0B0D12;
      --surface: #12151C;
      --surface-2: #171B23;
      --ink: #E8EAEE;
      --muted: #9AA1AE;
      --faint: #636B78;
      --line: #242934;
      --line-2: #1C2029;
      --primary: #7D93FF;
      --primary-600: #97A8FF;
      --primary-50: #1A2140;
      --on-primary: #0B0D12;
      --accent: #F0AE4E;
      --accent-ink: #F3C27A;
      --accent-50: #2B2214;
      --danger: #F07468;
      --danger-50: #341B19;
      --success: #4CC58A;
      --success-50: #14301F;
      --info: #7AA7F5;
      --info-50: #172338;
      --violet: #A98FF2;
      --violet-50: #241D3A;
      --c1: #7D93FF;
      --c2: #E39A2D;
      --nav: #12151C;
      --nav-ink: #6F7784;
      --nav-on: #7D93FF;
      --nav-pill: #1A2140;
    }

    body {
      letter-spacing: -.006em
    }

    main {
      padding: .25rem 1.07rem 2rem
    }

    ::selection {
      background: var(--primary-50)
    }

    /* ---------- top bar ---------- */
    .topbar {
      background: color-mix(in srgb, var(--bg) 92%, transparent);
      backdrop-filter: saturate(1.4) blur(10px);
      -webkit-backdrop-filter: saturate(1.4) blur(10px);
      min-height: 3.8rem;
      transition: border-color var(--t) var(--ease)
    }

    .topbar h2 {
      font-size: 1.2rem;
      font-weight: 650;
      letter-spacing: -.02em
    }

    .brand-mark {
      background: var(--primary);
      color: var(--on-primary)
    }

    [data-theme=dark] .brand-mark {
      background: var(--primary);
      color: var(--on-primary)
    }

    .brand-name {
      font-size: 1.1rem;
      font-weight: 700
    }

    .brand-name span {
      color: var(--primary);
      font-weight: 700
    }

    .icon-btn {
      transition: background var(--t-fast), transform var(--t-fast) var(--ease)
    }

    .icon-btn:active {
      transform: scale(.9)
    }

    /* ---------- page header (home) ---------- */
    .pgh {
      padding: .35rem 0 1rem
    }

    .ph-date {
      font-size: .8rem;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .08em
    }

    .ph-title {
      font-size: 1.9rem;
      font-weight: 700;
      letter-spacing: -.035em;
      line-height: 1.15;
      margin-top: .2rem
    }

    .ph-sub {
      color: var(--muted);
      font-size: .97rem;
      margin-top: .1rem
    }

    /* ---------- today card ---------- */
    .hero,
    [data-theme=dark] .hero {
      background: var(--surface);
      color: var(--ink);
      border: 1px solid var(--line);
      border-radius: var(--r);
      padding: 0;
      margin: 0
    }

    .hero-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: .8rem .95rem;
      border-bottom: 1px solid var(--line-2)
    }

    .hero-label,
    [data-theme=dark] .hero-label {
      display: flex;
      align-items: center;
      gap: .5rem;
      margin: 0;
      color: var(--ink);
      opacity: 1;
      font-size: .8rem;
      font-weight: 650;
      letter-spacing: .07em;
      text-transform: uppercase
    }

    .live {
      width: .5rem;
      height: .5rem;
      border-radius: 1px;
      background: var(--success);
      display: inline-block;
      animation: livep 2s ease-in-out infinite
    }

    @keyframes livep {
      50% {
        opacity: .25
      }
    }

    .hero-link,
    [data-theme=dark] .hero-link {
      display: inline-flex;
      width: auto;
      margin: 0;
      padding: .3rem .1rem;
      border: 0;
      color: var(--primary);
      font-size: .87rem;
      font-weight: 600;
      gap: .3rem
    }

    .hero-link span {
      flex: none
    }

    .hero-link svg {
      transition: transform var(--t) var(--ease)
    }

    .hero-link:hover svg {
      transform: translateX(3px)
    }

    .hero-stats {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 0;
      margin: 0;
      background: transparent;
      border: 0
    }

    .hero .hs,
    [data-theme=dark] .hero .hs {
      background: transparent;
      border: 0;
      border-right: 1px solid var(--line-2);
      border-radius: 0;
      color: var(--ink);
      padding: .85rem .95rem .95rem
    }

    .hero .hs:last-child {
      border-right: 0
    }

    .hero .hs:hover,
    [data-theme=dark] .hero .hs:hover {
      background: var(--surface-2)
    }

    .hero .hs .k,
    [data-theme=dark] .hero .hs .k {
      color: var(--muted);
      opacity: 1;
      font-size: .8rem
    }

    .hero .hs .v,
    [data-theme=dark] .hero .hs .v {
      color: var(--ink);
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: -.03em;
      margin-top: .15rem
    }

    .hero .hs:nth-child(3) .v,
    [data-theme=dark] .hero .hs:nth-child(3) .v {
      color: var(--primary)
    }

    @media (max-width:520px) {
      .hero-stats {
        grid-template-columns: repeat(2, minmax(0, 1fr))
      }

      .hero .hs:nth-child(2n) {
        border-right: 0
      }

      .hero .hs:nth-child(-n+2) {
        border-bottom: 1px solid var(--line-2)
      }
    }

    /* ---------- alerts ---------- */
    .alerts {
      margin-top: .75rem
    }

    .alert {
      height: 2.35rem;
      background: var(--surface);
      border: 1px solid var(--line);
      font-weight: 600;
      transition: border-color var(--t-fast), transform var(--t-fast) var(--ease)
    }

    .alert:hover {
      border-color: var(--faint)
    }

    .alert.a-green i {
      color: var(--success)
    }

    /* ---------- quick actions ---------- */
    .quick {
      gap: .5rem;
      margin-top: .9rem
    }

    .qa,
    .qa.q2,
    .qa.q3,
    .qa.q4 {
      background: var(--surface);
      border: 1px solid var(--line);
      color: var(--ink);
      border-radius: var(--r);
      padding: .85rem .2rem .75rem;
      font-weight: 600;
      font-size: .82rem
    }

    .qa:hover {
      border-color: var(--primary)
    }

    .qa-ic,
    .qa.q2 .qa-ic,
    .qa.q3 .qa-ic,
    .qa.q4 .qa-ic {
      width: 2.4rem;
      height: 2.4rem;
      border-radius: var(--r);
      background: var(--primary-50);
      color: var(--primary);
      transition: transform var(--t) var(--ease)
    }

    .qa:first-child,
    .qa:first-child:hover {
      background: var(--primary);
      border-color: var(--primary);
      color: var(--on-primary)
    }

    .qa:first-child .qa-ic {
      background: color-mix(in srgb, var(--on-primary) 16%, transparent);
      color: var(--on-primary)
    }

    .qa:hover .qa-ic {
      transform: translateY(-2px)
    }

    /* ---------- sections ---------- */
    .section {
      margin-top: 1.6rem
    }

    .section-head {
      margin-bottom: .6rem;
      align-items: baseline
    }

    .section-title {
      font-size: 1rem;
      font-weight: 650;
      letter-spacing: -.015em;
      color: var(--ink);
      text-transform: none
    }

    .link {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      font-size: .88rem
    }

    .link:hover {
      text-decoration: underline;
      text-underline-offset: 3px
    }

    /* ---------- status boxes ---------- */
    .stb {
      border: 1px solid var(--line);
      padding: .9rem;
      transition: border-color var(--t-fast)
    }

    .stb:hover {
      border-color: var(--primary)
    }

    .stb-ic {
      background: var(--info-50);
      color: var(--info)
    }

    .stb .n {
      font-size: 1.85rem;
      font-weight: 700
    }

    /* ---------- surfaces ---------- */
    .card,
    .panel,
    .agenda,
    .detail-head,
    .pipe-card,
    .mcard,
    .kpi,
    .tile,
    .todo,
    .glist,
    .ghead,
    .stb {
      border-color: var(--line);
      border-radius: var(--r)
    }

    .card {
      transition: border-color var(--t-fast), background var(--t-fast), transform var(--t-fast) var(--ease)
    }

    .card:hover {
      border-color: color-mix(in srgb, var(--primary) 35%, var(--line));
      background: var(--surface)
    }

    .ag:hover,
    .grow:hover,
    .entry:hover {
      background: var(--surface-2)
    }

    .ag-kind.k-del {
      background: var(--primary-50);
      color: var(--primary)
    }

    .order-card {
      padding-left: 1.05rem
    }

    .order-card::before {
      width: 3px;
      border-radius: var(--r) 0 0 var(--r)
    }

    .oc-no {
      font-weight: 650;
      color: var(--muted);
      font-size: .85rem
    }

    .oc-name {
      font-size: 1.06rem;
      font-weight: 650
    }

    .oc-book {
      color: var(--muted);
      border-color: var(--line);
      background: var(--surface-2)
    }

    .oc-bottom {
      border-top-color: var(--line-2)
    }

    .detail-head {
      padding: 1.15rem
    }

    .dh-title {
      letter-spacing: -.03em
    }

    .mcard .v,
    .kpi .v {
      font-weight: 700;
      letter-spacing: -.025em
    }

    .kpi {
      transition: border-color var(--t-fast)
    }

    .kpis .kpi:hover {
      border-color: var(--primary)
    }

    /* ---------- pills & tags ---------- */
    .pill,
    [data-theme=dark] .pill {
      background: color-mix(in srgb, var(--sc) 11%, transparent);
      border: 0;
      color: var(--sc);
      padding: .18rem .5rem .18rem .45rem;
      font-weight: 600;
      border-radius: var(--r-sm)
    }

    .pill::before {
      content: "";
      width: .42rem;
      height: .42rem;
      border-radius: 1px;
      background: var(--sc);
      flex-shrink: 0
    }

    .tag {
      border-radius: var(--r-sm)
    }

    /* ---------- chips / segments ---------- */
    .chip {
      background: var(--surface);
      color: var(--muted);
      border-color: var(--line);
      transition: all var(--t-fast)
    }

    .chip:hover {
      border-color: var(--faint);
      color: var(--ink)
    }

    .chip.on,
    [data-theme=dark] .chip.on {
      background: var(--primary-50);
      border-color: var(--primary);
      color: var(--primary)
    }

    .chip.on .n,
    [data-theme=dark] .chip.on .n {
      color: var(--primary);
      opacity: .75
    }

    .seg button {
      transition: background var(--t-fast), color var(--t-fast), border-color var(--t-fast), transform var(--t-fast) var(--ease)
    }

    .seg button.on,
    .langs button.on,
    .seg2 button.on,
    [data-theme=dark] .seg button.on,
    [data-theme=dark] .langs button.on {
      background: var(--primary);
      border-color: var(--primary);
      color: var(--on-primary)
    }

    .seg button.on {
      animation: pop .25s var(--ease)
    }

    .stseg {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 0;
      border: 1px solid var(--line);
      border-radius: var(--r);
      padding: 3px;
      background: var(--surface-2)
    }

    .stseg button {
      border: 0;
      background: transparent;
      height: 2.75rem;
      border-radius: var(--r-sm);
      color: var(--muted)
    }

    .stseg button.on,
    [data-theme=dark] .stseg button.on {
      background: var(--surface);
      color: var(--ink);
      border: 1px solid var(--line);
      font-weight: 650
    }

    .stseg button[data-status=Ready].on {
      color: var(--success)
    }

    .stseg button[data-status=Delivered].on {
      color: var(--muted)
    }

    .langs button {
      transition: background var(--t-fast)
    }

    /* ---------- buttons ---------- */
    .btn {
      transition: background var(--t-fast), border-color var(--t-fast), color var(--t-fast), transform var(--t-fast) var(--ease)
    }

    .btn:active:not(:disabled),
    .qa:active,
    .card:active,
    .tile:active,
    .stb:active,
    .cg:active,
    .chip:active,
    .seg button:active,
    .hs:active,
    .grow:active,
    .alert:active,
    .ag:active,
    .pk-item:active {
      transform: scale(.97)
    }

    .btn-primary,
    [data-theme=dark] .btn-primary {
      background: var(--primary);
      color: var(--on-primary)
    }

    .btn-primary:hover,
    [data-theme=dark] .btn-primary:hover {
      background: var(--primary-600)
    }

    .btn-secondary:hover {
      border-color: var(--faint);
      background: var(--surface-2)
    }

    .btn-accent {
      background: var(--accent);
      color: #231503
    }

    .ic-n,
    [data-theme=dark] .ic-n {
      background: var(--primary-50);
      color: var(--primary)
    }

    .ic-sq {
      border-radius: var(--r)
    }

    /* ---------- inputs ---------- */
    .input,
    .select,
    .textarea {
      background: var(--surface);
      border-color: var(--line);
      transition: border-color var(--t-fast), outline-color var(--t-fast)
    }

    .input:hover,
    .select:hover,
    .textarea:hover {
      border-color: var(--faint)
    }

    .input:focus,
    .select:focus,
    .textarea:focus {
      background: var(--surface);
      border-color: var(--primary);
      outline: 3px solid var(--primary-50);
      outline-offset: 0
    }

    .input.invalid,
    .select.invalid {
      border-color: var(--danger);
      outline: 3px solid var(--danger-50);
      outline-offset: 0;
      animation: nudge .3s
    }

    .search input {
      transition: border-color var(--t-fast), outline-color var(--t-fast)
    }

    .search input:focus {
      outline: 3px solid var(--primary-50);
      outline-offset: 0
    }

    .pk-sel {
      border-color: var(--primary);
      background: var(--primary-50);
      animation: rise .22s var(--ease)
    }

    .mic {
      background: var(--primary-50);
      color: var(--primary);
      transition: transform var(--t-fast) var(--ease)
    }

    .mic:active {
      transform: translateY(-50%) scale(.9)
    }

    .mic.listening {
      background: var(--danger);
      color: #fff;
      animation: none;
      outline: 2px solid var(--danger);
      outline-offset: 2px
    }

    .mic.listening::after {
      content: "";
      position: absolute;
      inset: -6px;
      border: 2px solid var(--danger);
      border-radius: var(--r);
      animation: ring 1.1s ease-out infinite
    }

    @keyframes ring {
      from {
        opacity: .8;
        transform: scale(.85)
      }

      to {
        opacity: 0;
        transform: scale(1.25)
      }
    }

    input[type=checkbox] {
      accent-color: var(--primary)
    }

    input[type=checkbox]:checked {
      animation: pop .25s var(--ease)
    }

    .err.show {
      animation: rise .2s var(--ease)
    }

    /* ---------- bottom nav ---------- */
    .nav,
    [data-theme=dark] .nav {
      background: var(--nav);
      border-top: 1px solid var(--line)
    }

    .nav-inner {
      position: relative
    }

    .nav button.tab,
    [data-theme=dark] .nav button.tab {
      color: var(--nav-ink);
      transition: color var(--t) var(--ease)
    }

    .nav button.tab .ni {
      transition: background var(--t) var(--ease), transform var(--t) var(--ease)
    }

    .nav button.tab.on,
    [data-theme=dark] .nav button.tab.on {
      color: var(--nav-on);
      font-weight: 650
    }

    .nav button.tab.on .ni {
      background: var(--nav-pill);
      transform: translateY(-1px)
    }

    .nav button.tab:active .ni {
      transform: scale(.88)
    }

    .nav .plus,
    [data-theme=dark] .nav .plus {
      background: var(--primary);
      color: var(--on-primary);
      border-radius: var(--r);
      transition: transform var(--t) var(--ease), background var(--t-fast)
    }

    .nav .plus svg {
      transition: transform .3s var(--ease)
    }

    .nav .plus:hover svg,
    .nav .plus:active svg {
      transform: rotate(90deg)
    }

    .nav .plus:active {
      transform: scale(.92)
    }

    .nav .badge {
      background: var(--danger);
      color: #fff
    }

    .nav-ind {
      position: absolute;
      top: -1px;
      height: 2px;
      background: var(--primary);
      border-radius: 0 0 2px 2px;
      transition: left .32s var(--ease), width .32s var(--ease);
      pointer-events: none
    }

    /* ---------- more / settings ---------- */
    .tile .ic-sq {
      background: var(--primary-50);
      color: var(--primary);
      transition: transform var(--t) var(--ease)
    }

    .tile:hover {
      border-color: color-mix(in srgb, var(--primary) 35%, var(--line))
    }

    .tile:hover .ic-sq {
      transform: translateY(-2px)
    }

    .shop-card .brand-mark {
      background: var(--primary);
      color: var(--on-primary)
    }

    .setrow .ic-sq {
      background: var(--surface-2);
      border: 1px solid var(--line-2);
      color: var(--ink)
    }

    /* ---------- cloth types ---------- */
    .g-ic,
    [data-theme=dark] .g-ic {
      background: var(--primary-50);
      color: var(--primary)
    }

    .more-opt {
      background: var(--surface-2);
      border-color: var(--line)
    }

    .more-opt summary {
      list-style: none;
      display: flex;
      align-items: center;
      gap: .4rem
    }

    .more-opt summary::before {
      content: "";
      width: .45rem;
      height: .45rem;
      border-right: 2px solid var(--muted);
      border-bottom: 2px solid var(--muted);
      transform: rotate(-45deg);
      transition: transform var(--t) var(--ease);
      margin-right: .2rem
    }

    .more-opt[open] summary::before {
      transform: rotate(45deg)
    }

    .more-opt summary::-webkit-details-marker {
      display: none
    }

    /* ---------- sheets, dialogs, toast ---------- */
    .backdrop {
      background: rgba(10, 12, 18, .5);
      animation: fade .2s
    }

    .sheet,
    [data-theme=dark] .sheet {
      border-top: 1px solid var(--line);
      animation: sheetUp .32s var(--ease)
    }

    .sheet-grab {
      display: flex;
      justify-content: center;
      padding: .5rem 0 .1rem;
      cursor: grab;
      touch-action: none
    }

    .sheet-grab::before {
      content: "";
      width: 2.4rem;
      height: 4px;
      border-radius: 2px;
      background: var(--line)
    }

    .sheet-head {
      border-bottom-color: var(--line-2);
      padding-top: .25rem
    }

    .sheet-head h3 {
      font-weight: 650;
      letter-spacing: -.02em
    }

    .sheet.dragging {
      animation: none;
      transition: none
    }

    .sheet.settle {
      transition: transform .22s var(--ease)
    }

    .sheet-body {
      padding-bottom: 0
    }

    .sheet-body:not(:has(.form-actions))::after {
      content: "";
      display: block;
      height: calc(1.25rem + env(safe-area-inset-bottom))
    }

    .form-actions {
      position: sticky;
      bottom: 0;
      background: var(--surface);
      margin: 1rem 0 0;
      padding: .8rem 0 calc(.9rem + env(safe-area-inset-bottom));
      border-top: 1px solid var(--line-2);
      z-index: 2
    }

    @keyframes sheetUp {
      from {
        transform: translateY(100%)
      }

      to {
        transform: none
      }
    }

    @media(min-width:640px) {
      .sheet {
        animation: dlgIn .22s var(--ease)
      }

      .sheet-grab {
        display: none
      }
    }

    .cg {
      transition: border-color var(--t-fast), transform var(--t-fast) var(--ease)
    }

    .cg:hover {
      border-color: var(--primary)
    }

    .cg .ic-sq {
      background: var(--primary-50);
      color: var(--primary)
    }

    .cg:first-child {
      background: var(--primary);
      border-color: var(--primary);
      color: var(--on-primary)
    }

    .cg:first-child .ic-sq {
      background: color-mix(in srgb, var(--on-primary) 16%, transparent);
      color: var(--on-primary)
    }

    .create-grid .cg {
      animation: rise .3s var(--ease) both
    }

    .create-grid .cg:nth-child(2) {
      animation-delay: .03s
    }

    .create-grid .cg:nth-child(3) {
      animation-delay: .06s
    }

    .create-grid .cg:nth-child(4) {
      animation-delay: .09s
    }

    .create-grid .cg:nth-child(5) {
      animation-delay: .12s
    }

    .create-grid .cg:nth-child(6) {
      animation-delay: .15s
    }

    .dialog-wrap {
      background: rgba(10, 12, 18, .5)
    }

    .dlg {
      animation: dlgIn .22s var(--ease)
    }

    @keyframes dlgIn {
      from {
        opacity: 0;
        transform: translateY(8px) scale(.97)
      }

      to {
        opacity: 1;
        transform: none
      }
    }

    .toast {
      background: var(--ink);
      color: var(--bg);
      border-radius: var(--r);
      transition: opacity .2s var(--ease), transform .28s var(--ease);
      top: auto;
      bottom: calc(5.2rem + env(safe-area-inset-bottom));
      transform: translate(-50%, 14px)
    }

    .toast.show {
      transform: translate(-50%, 0)
    }

    .toast svg {
      color: #5ED6A0
    }

    [data-theme=dark] .toast svg {
      color: #0F7A45
    }

    .toast.show svg path,
    .toast.show svg polyline {
      stroke-dasharray: 30;
      stroke-dashoffset: 30;
      animation: draw .45s .08s var(--ease) forwards
    }

    @keyframes draw {
      to {
        stroke-dashoffset: 0
      }
    }

    .toast .tbtn {
      color: var(--accent)
    }

    .lightbox.open img {
      animation: dlgIn .25s var(--ease)
    }

    /* ---------- empty states ---------- */
    .empty {
      border-style: dashed;
      background: var(--surface)
    }

    .empty-ic {
      width: 3rem;
      height: 3rem;
      border-radius: var(--r);
      background: var(--surface-2);
      border: 1px solid var(--line-2);
      color: var(--faint)
    }

    /* ---------- motion ---------- */
    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(8px)
      }

      to {
        opacity: 1;
        transform: none
      }
    }

    @keyframes pop {
      0% {
        transform: scale(.92)
      }

      60% {
        transform: scale(1.04)
      }

      100% {
        transform: scale(1)
      }
    }

    @keyframes nudge {

      20%,
      60% {
        transform: translateX(-3px)
      }

      40%,
      80% {
        transform: translateX(3px)
      }
    }

    @keyframes vf {
      from {
        opacity: 0;
        transform: translateY(12px)
      }

      to {
        opacity: 1;
        transform: none
      }
    }

    @keyframes vb {
      from {
        opacity: 0;
        transform: translateY(-8px)
      }

      to {
        opacity: 1;
        transform: none
      }
    }

    @keyframes vt {
      from {
        opacity: 0;
        transform: translateY(6px)
      }

      to {
        opacity: 1;
        transform: none
      }
    }

    #view.vf {
      animation: vf .26s var(--ease)
    }

    #view.vb {
      animation: vb .26s var(--ease)
    }

    #view.vt {
      animation: vt .22s var(--ease)
    }

    .rise {
      animation: rise .34s var(--ease) both
    }

    .bump {
      animation: pop .3s var(--ease)
    }

    .flash {
      animation: flash .9s var(--ease)
    }

    @keyframes flash {
      0% {
        background: var(--primary-50)
      }

      100% {
        background: transparent
      }
    }

    @media (prefers-reduced-motion:reduce) {

      *,
      *::before,
      *::after {
        animation: none !important;
        transition: none !important
      }
    }

    /* =====================================================================
   v8 — "Plum & Saffron" — Plus Jakarta Sans, Tabler icons. Flat: 2–4px radius, no shadows, no gradients.
   ===================================================================== */
    :root {
      --bg: #F7F5F2;
      --surface: #FFFFFF;
      --surface-2: #FAF8F6;
      --ink: #1D1820;
      --muted: #6A6270;
      --faint: #A69EAB;
      --line: #E7E2E9;
      --line-2: #F1EDF2;
      --primary: #5B2A72;
      --primary-600: #4A2160;
      --primary-50: #F3EBF6;
      --on-primary: #FFFFFF;
      --accent: #E3A13A;
      --accent-ink: #8C5A0B;
      --accent-50: #FCF2E0;
      --danger: #C7362F;
      --danger-50: #FCECEA;
      --success: #1F7A4D;
      --success-50: #E7F5ED;
      --info: #2E62B8;
      --info-50: #EAF0FA;
      --violet: #7A4BC4;
      --violet-50: #F2ECFB;
      --c1: #5B2A72;
      --c2: #E3A13A;
      --font: 'Plus Jakarta Sans', 'Noto Sans Gujarati', 'Noto Sans Devanagari', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      --nav: #FFFFFF;
      --nav-ink: #958C9B;
      --nav-on: #5B2A72;
      --nav-pill: #F3EBF6;
      --ease: cubic-bezier(.2, .8, .2, 1);
    }

    [data-theme=dark] {
      --bg: #110E13;
      --surface: #19151C;
      --surface-2: #1F1A23;
      --ink: #EEE9F0;
      --muted: #A79FAD;
      --faint: #6E6574;
      --line: #2B2530;
      --line-2: #221D26;
      --primary: #C9A0E0;
      --primary-600: #D9B8EC;
      --primary-50: #2A1F33;
      --on-primary: #1A1020;
      --accent: #F0B457;
      --accent-ink: #F3C77E;
      --accent-50: #2E2414;
      --danger: #F07468;
      --danger-50: #361C1A;
      --success: #52C68D;
      --success-50: #15301F;
      --info: #7FA8F2;
      --info-50: #18233A;
      --violet: #B497F0;
      --violet-50: #261E3B;
      --c1: #C9A0E0;
      --c2: #F0B457;
      --nav: #19151C;
      --nav-ink: #6E6574;
      --nav-on: #C9A0E0;
      --nav-pill: #2A1F33;
    }

    html,
    body {
      font-family: var(--font);
      letter-spacing: -.01em
    }

    body {
      font-feature-settings: "ss01", "cv11"
    }

    svg {
      flex-shrink: 0
    }

    /* ---------- top bar ---------- */
    .topbar {
      min-height: 3.7rem;
      background: color-mix(in srgb, var(--bg) 90%, transparent)
    }

    .topbar h2 {
      font-size: 1.12rem;
      font-weight: 700;
      letter-spacing: -.02em
    }

    .topbar.big h2 {
      font-size: 1.65rem;
      font-weight: 800;
      letter-spacing: -.04em
    }

    .topbar.big {
      min-height: 4.3rem
    }

    .brand-mark {
      background: var(--primary);
      color: var(--on-primary);
      border-radius: var(--r)
    }

    .brand-name {
      font-weight: 800;
      letter-spacing: -.03em
    }

    .brand-name span {
      color: var(--accent-ink);
      font-weight: 800
    }

    [data-theme=dark] .brand-name span {
      color: var(--accent)
    }

    /* ---------- home header ---------- */
    .pgh {
      display: flex;
      align-items: flex-end;
      gap: .75rem;
      padding: .4rem 0 1rem
    }

    .pgh-l {
      flex: 1;
      min-width: 0
    }

    .ph-date {
      font-size: .75rem;
      font-weight: 700;
      color: var(--accent-ink);
      text-transform: uppercase;
      letter-spacing: .1em
    }

    [data-theme=dark] .ph-date {
      color: var(--accent)
    }

    .ph-title {
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: -.045em;
      line-height: 1.1;
      margin-top: .25rem
    }

    .pgh-shop {
      width: 2.9rem;
      height: 2.9rem;
      border-radius: var(--r);
      background: var(--surface);
      border: 1px solid var(--line);
      display: grid;
      place-items: center;
      font-weight: 800;
      color: var(--primary);
      font-size: .95rem;
      transition: border-color .15s, transform .15s var(--ease)
    }

    .pgh-shop:hover {
      border-color: var(--primary)
    }

    .pgh-shop:active {
      transform: scale(.92)
    }

    /* ---------- today hero (plum block) ---------- */
    .hero.h10,
    [data-theme=dark] .hero.h10 {
      background: var(--primary);
      color: var(--on-primary);
      border: 0;
      border-radius: var(--r);
      padding: 0;
      overflow: hidden
    }

    [data-theme=dark] .hero.h10 {
      background: var(--primary-50);
      color: var(--ink);
      border: 1px solid var(--line)
    }

    .h10-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: .85rem 1rem 0
    }

    .h10 .hero-label {
      color: inherit;
      opacity: .85;
      font-size: .72rem;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: .5rem;
      margin: 0
    }

    .h10 .live {
      background: var(--accent)
    }

    .h10 .hero-link,
    [data-theme=dark] .h10 .hero-link {
      color: inherit;
      opacity: .95;
      border: 0;
      width: auto;
      margin: 0;
      padding: .35rem .55rem;
      border: 1px solid color-mix(in srgb, currentColor 28%, transparent);
      border-radius: var(--r);
      font-size: .82rem;
      font-weight: 600;
      display: inline-flex;
      gap: .35rem;
      align-items: center
    }

    .h10 .hero-link:hover {
      background: color-mix(in srgb, currentColor 10%, transparent)
    }

    .h10-big {
      padding: .9rem 1rem 1rem
    }

    .h10-k {
      font-size: .85rem;
      opacity: .75;
      font-weight: 500
    }

    .h10-v {
      font-size: 2.6rem;
      font-weight: 800;
      letter-spacing: -.05em;
      line-height: 1.05;
      margin-top: .15rem
    }

    .h10-modes {
      display: flex;
      gap: .4rem;
      flex-wrap: wrap;
      margin-top: .55rem
    }

    .h10-modes span {
      font-size: .75rem;
      font-weight: 600;
      padding: .15rem .45rem;
      border-radius: var(--r-sm);
      background: color-mix(in srgb, currentColor 12%, transparent)
    }

    .h10 .hero-stats {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 0;
      margin: 0;
      border: 0;
      border-top: 1px solid color-mix(in srgb, currentColor 18%, transparent);
      background: color-mix(in srgb, #000 10%, transparent)
    }

    [data-theme=dark] .h10 .hero-stats {
      background: transparent
    }

    .h10 .hs,
    [data-theme=dark] .h10 .hs {
      background: transparent;
      border: 0;
      border-right: 1px solid color-mix(in srgb, currentColor 14%, transparent);
      border-radius: 0;
      color: inherit;
      padding: .75rem .7rem .8rem;
      text-align: left;
      min-width: 0
    }

    .h10 .hs:last-child {
      border-right: 0
    }

    .h10 .hs:hover,
    [data-theme=dark] .h10 .hs:hover {
      background: color-mix(in srgb, currentColor 8%, transparent)
    }

    .hs-ic {
      display: inline-grid;
      place-items: center;
      width: 1.6rem;
      height: 1.6rem;
      border-radius: var(--r-sm);
      background: color-mix(in srgb, currentColor 14%, transparent);
      margin-bottom: .4rem
    }

    .h10 .hs .k,
    [data-theme=dark] .h10 .hs .k {
      color: inherit;
      opacity: .75;
      font-size: .72rem;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    .h10 .hs .v,
    [data-theme=dark] .h10 .hs .v,
    .h10 .hs:nth-child(3) .v,
    [data-theme=dark] .h10 .hs:nth-child(3) .v {
      color: inherit;
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: -.03em;
      margin-top: .05rem
    }

    @media (max-width:360px) {
      .h10 .hs {
        padding: .65rem .5rem
      }

      .h10 .hs .v {
        font-size: 1.2rem
      }

      .h10-v {
        font-size: 2.2rem
      }
    }

    /* ---------- quick actions row ---------- */
    .quick {
      display: none
    }

    .qrow {
      display: flex;
      gap: .45rem;
      overflow-x: auto;
      margin: .85rem -1.07rem 0;
      padding: 0 1.07rem .1rem;
      scrollbar-width: none
    }

    .qrow::-webkit-scrollbar {
      display: none
    }

    .qrow .qa {
      flex: 0 0 auto;
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: .5rem;
      height: 2.9rem;
      padding: 0 .95rem 0 .55rem;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--ink);
      border-radius: var(--r);
      font-size: .9rem;
      font-weight: 600;
      white-space: nowrap
    }

    .qrow .qa .qa-ic {
      width: 1.95rem;
      height: 1.95rem;
      border-radius: var(--r-sm);
      background: var(--primary-50);
      color: var(--primary);
      display: grid;
      place-items: center
    }

    .qrow .qa:hover {
      border-color: var(--primary)
    }

    .qrow .qa.qa-main {
      background: var(--accent);
      border-color: var(--accent);
      color: #2A1A02
    }

    .qrow .qa.qa-main .qa-ic {
      background: color-mix(in srgb, #fff 35%, transparent);
      color: #2A1A02
    }

    /* ---------- alerts ---------- */
    .alerts {
      margin-top: .6rem
    }

    .alert {
      border-radius: var(--r);
      height: 2.3rem;
      font-size: .84rem
    }

    /* ---------- sections ---------- */
    .section {
      margin-top: 1.7rem
    }

    .section-head {
      margin-bottom: .65rem
    }

    .section-title {
      display: flex;
      align-items: center;
      gap: .45rem;
      font-size: 1.02rem;
      font-weight: 750;
      letter-spacing: -.02em
    }

    .section-title>svg {
      color: var(--primary)
    }

    .sc-n {
      font-size: .75rem;
      font-weight: 700;
      color: var(--muted);
      background: var(--line-2);
      padding: .05rem .4rem;
      border-radius: var(--r-sm)
    }

    .link {
      color: var(--primary);
      font-weight: 650;
      font-size: .87rem
    }

    /* ---------- attention timeline ---------- */
    .tl10 {
      position: relative;
      padding: .25rem 0
    }

    .tl10 .ag {
      position: relative;
      border-bottom: 0;
      padding: .65rem .9rem .65rem .9rem
    }

    .tl10 .ag+.ag::before {
      content: "";
      position: absolute;
      left: 2.02rem;
      top: -.55rem;
      height: .9rem;
      width: 1px;
      background: var(--line)
    }

    .tl10 .ag-kind {
      width: 2.25rem;
      height: 2.25rem
    }

    .ag-no {
      color: var(--faint);
      font-weight: 600;
      font-size: .85rem
    }

    .ag-tag {
      font-size: .7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .06em;
      padding: .15rem .4rem;
      border-radius: var(--r-sm);
      background: var(--line-2);
      color: var(--muted)
    }

    .ag.k-late .ag-tag {
      background: var(--danger-50);
      color: var(--danger)
    }

    .ag.k-trial .ag-tag {
      background: var(--accent-50);
      color: var(--accent-ink)
    }

    .ag.k-del .ag-tag {
      background: var(--primary-50);
      color: var(--primary)
    }

    .ag-kind.k-del {
      background: var(--primary-50);
      color: var(--primary)
    }

    /* ---------- workload ---------- */
    .wl {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--r);
      padding: 1rem
    }

    .wl-bar {
      display: flex;
      gap: 3px;
      height: .6rem
    }

    .wl-bar span {
      display: block;
      height: 100%;
      border-radius: var(--r-sm);
      transition: width .6s var(--ease);
      min-width: 3px
    }

    .wl-a {
      background: var(--primary)
    }

    .wl-b {
      background: var(--accent)
    }

    .wl-legend {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: .5rem;
      margin-top: .8rem
    }

    .wl .stb,
    [data-theme=dark] .wl .stb {
      display: grid;
      grid-template-columns: auto 1fr;
      grid-template-rows: auto auto;
      column-gap: .5rem;
      align-items: center;
      border: 1px solid var(--line-2);
      background: var(--surface-2);
      padding: .7rem .8rem;
      border-radius: var(--r)
    }

    .wl .stb .l {
      grid-column: 2;
      font-size: .8rem;
      color: var(--muted);
      font-weight: 500
    }

    .wl .stb .n {
      grid-column: 1 / -1;
      font-size: 1.7rem;
      font-weight: 800;
      letter-spacing: -.04em;
      line-height: 1.1;
      margin-top: .15rem
    }

    .wl-dot {
      width: .6rem;
      height: .6rem;
      border-radius: 1px;
      display: block
    }

    .wl-dot.a {
      background: var(--primary)
    }

    .wl-dot.b {
      background: var(--accent)
    }

    /* ---------- order & customer rows ---------- */
    .list.rows {
      gap: 0;
      display: block;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--r);
      overflow: hidden
    }

    .list.rows>.card {
      border: 0;
      border-radius: 0;
      border-bottom: 1px solid var(--line-2);
      margin: 0
    }

    .list.rows>.card:last-child {
      border-bottom: 0
    }

    .card.orow,
    .card.crow {
      display: flex;
      align-items: center;
      gap: .75rem;
      padding: .8rem .9rem;
      text-align: left;
      width: 100%;
      position: relative
    }

    .order-card.orow::before {
      left: 0;
      top: .8rem;
      bottom: .8rem;
      width: 3px;
      border-radius: 0 2px 2px 0
    }

    .or-av {
      width: 2.6rem;
      height: 2.6rem;
      border-radius: var(--r);
      display: grid;
      place-items: center;
      font-weight: 750;
      font-size: .88rem;
      flex-shrink: 0;
      letter-spacing: -.02em
    }

    .or-av.or-no {
      background: var(--line-2);
      color: var(--muted);
      font-size: .78rem
    }

    .or-main {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: .12rem
    }

    .or-l1 {
      display: flex;
      align-items: center;
      gap: .4rem;
      min-width: 0;
      white-space: nowrap;
      overflow: hidden
    }

    .or-l1 b {
      font-weight: 700;
      font-size: 1rem;
      overflow: hidden;
      text-overflow: ellipsis;
      letter-spacing: -.015em
    }

    .or-l1 .oc-name {
      font-size: 1rem;
      margin: 0
    }

    .or-l2 {
      font-size: .84rem;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: flex;
      align-items: center;
      gap: .25rem
    }

    .or-l3 {
      font-size: .8rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: .3rem;
      margin-top: .1rem
    }

    .or-l3:not(.danger):not(.warn) {
      color: var(--faint)
    }

    .or-end {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: .3rem;
      flex-shrink: 0;
      text-align: right
    }

    .or-amt {
      font-weight: 750;
      font-size: .95rem;
      letter-spacing: -.02em
    }

    .or-end .bal {
      font-size: .75rem;
      font-weight: 700;
      color: var(--danger)
    }

    .or-end .paid {
      font-size: .75rem;
      font-weight: 700;
      color: var(--success)
    }

    .cr-act {
      font-size: .72rem;
      font-weight: 700;
      color: var(--primary);
      background: var(--primary-50);
      padding: .12rem .4rem;
      border-radius: var(--r-sm)
    }

    .oc-book {
      display: inline-block;
      font-size: .7rem;
      font-weight: 700;
      color: var(--muted);
      border: 1px solid var(--line);
      border-radius: var(--r-sm);
      padding: 0 .3rem;
      background: var(--surface-2);
      flex-shrink: 0;
      margin: 0
    }

    .card.orow:hover,
    .card.crow:hover {
      background: var(--surface-2)
    }

    .card.orow.selected {
      background: var(--primary-50)
    }

    .selbox {
      flex-shrink: 0
    }

    .grp {
      margin-top: 1rem
    }

    .grp:first-of-type {
      margin-top: .25rem
    }

    .grp-h {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: .72rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .1em;
      color: var(--muted);
      padding: 0 .15rem .45rem
    }

    .grp-n {
      font-size: .72rem;
      color: var(--faint)
    }

    .g-late .grp-h {
      color: var(--danger)
    }

    .g-today .grp-h {
      color: var(--accent-ink)
    }

    [data-theme=dark] .g-today .grp-h {
      color: var(--accent)
    }

    .result-count {
      margin-bottom: .35rem
    }

    /* ---------- pills / tags ---------- */
    .pill {
      border-radius: var(--r-sm);
      font-size: .72rem;
      padding: .14rem .45rem;
      font-weight: 700;
      background: color-mix(in srgb, var(--sc) 12%, transparent);
      color: var(--sc);
      border: 0
    }

    .pill::before {
      content: "";
      width: .4rem;
      height: .4rem;
      border-radius: 1px;
      background: var(--sc)
    }

    .s-received {
      --sc: var(--primary)
    }

    .s-ready {
      --sc: var(--success)
    }

    .s-delivered {
      --sc: var(--faint)
    }

    .s-cancelled {
      --sc: var(--danger)
    }

    .tag {
      font-size: .66rem;
      font-weight: 800;
      letter-spacing: .06em
    }

    /* ---------- customer profile ---------- */
    .prof {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--r);
      padding: 1.4rem 1rem 0;
      text-align: center;
      overflow: hidden
    }

    .avatar.xl {
      width: 4.6rem;
      height: 4.6rem;
      font-size: 1.6rem;
      margin: 0 auto;
      border-radius: var(--r);
      font-weight: 800
    }

    .prof-name {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: -.04em;
      margin-top: .7rem
    }

    .prof-sub {
      display: flex;
      gap: .4rem;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      margin-top: .35rem
    }

    .prof-meta {
      color: var(--muted);
      font-size: .88rem;
      margin-top: .4rem
    }

    .prof-acts {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: .45rem;
      margin-top: 1.1rem
    }

    .pa {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: .3rem;
      padding: .65rem .2rem;
      border: 1px solid var(--line);
      border-radius: var(--r);
      font-size: .78rem;
      font-weight: 600;
      color: var(--ink);
      background: var(--surface);
      text-decoration: none;
      transition: border-color .15s, transform .15s var(--ease)
    }

    .pa svg {
      color: var(--primary)
    }

    .pa:hover {
      border-color: var(--primary)
    }

    .pa:active {
      transform: scale(.95)
    }

    .pa.pa-main {
      background: var(--primary);
      border-color: var(--primary);
      color: var(--on-primary)
    }

    .pa.pa-main svg {
      color: var(--on-primary)
    }

    .prof-stats {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      margin: 1.1rem -1rem 0;
      border-top: 1px solid var(--line-2)
    }

    .prof-stats>div {
      padding: .8rem .5rem;
      border-right: 1px solid var(--line-2)
    }

    .prof-stats>div:last-child {
      border-right: 0
    }

    .prof-stats .v {
      font-size: 1.2rem;
      font-weight: 800;
      letter-spacing: -.03em
    }

    .prof-stats .v.danger {
      color: var(--danger)
    }

    .prof-stats .k {
      font-size: .75rem;
      color: var(--muted);
      font-weight: 500
    }

    .utabs {
      display: flex;
      gap: 0;
      margin-top: 1.2rem;
      border-bottom: 1px solid var(--line);
      position: sticky;
      top: 3.7rem;
      background: var(--bg);
      z-index: 5
    }

    .utabs button {
      flex: 1;
      height: 2.9rem;
      font-weight: 650;
      font-size: .9rem;
      color: var(--muted);
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
      border-radius: 0;
      transition: color .15s, border-color .2s var(--ease)
    }

    .utabs button span {
      font-size: .72rem;
      color: var(--faint);
      font-weight: 700;
      margin-left: .15rem
    }

    .utabs button.on {
      color: var(--primary);
      border-bottom-color: var(--primary)
    }

    .utabs button.on span {
      color: var(--primary)
    }

    .utab-body {
      padding-top: 1rem
    }

    /* ---------- more menu ---------- */
    .shop-card {
      display: flex;
      align-items: center;
      gap: .8rem;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--r);
      padding: .9rem
    }

    .shop-card .brand-mark {
      width: 3rem;
      height: 3rem;
      background: var(--primary);
      color: var(--on-primary)
    }

    .shop-card .person-name {
      font-weight: 750;
      font-size: 1.05rem
    }

    .mgrp-h {
      font-size: .72rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .1em;
      color: var(--muted);
      padding: 0 .15rem .5rem
    }

    .mgrp {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--r);
      overflow: hidden
    }

    .tile.mrow {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: .8rem;
      width: 100%;
      padding: .8rem .9rem;
      border: 0;
      border-bottom: 1px solid var(--line-2);
      border-radius: 0;
      background: transparent;
      position: static
    }

    .tile.mrow:last-child {
      border-bottom: 0
    }

    .tile.mrow:hover {
      background: var(--surface-2)
    }

    .tile.mrow .ic-sq {
      width: 2.3rem;
      height: 2.3rem;
      background: var(--primary-50);
      color: var(--primary)
    }

    .mr-t {
      flex: 1;
      min-width: 0
    }

    .mr-t b {
      display: block;
      font-weight: 650;
      font-size: .97rem
    }

    .mr-t small {
      display: block;
      color: var(--muted);
      font-size: .8rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    .mr-b {
      font-size: .72rem;
      font-weight: 700;
      color: var(--danger);
      background: var(--danger-50);
      padding: .12rem .45rem;
      border-radius: var(--r-sm)
    }

    .mgrp .setrow {
      padding: .8rem .9rem;
      border-bottom: 1px solid var(--line-2)
    }

    .mgrp .setrow:first-child {
      padding-top: .8rem
    }

    .mgrp .setrow:last-child {
      border-bottom: 0;
      padding-bottom: .8rem
    }

    .setrow .ic-sq {
      background: var(--primary-50);
      color: var(--primary);
      border: 0
    }

    .switch.on {
      background: var(--primary)
    }

    /* ---------- generic surfaces ---------- */
    .card,
    .panel,
    .agenda,
    .detail-head,
    .mcard,
    .kpi,
    .todo,
    .glist,
    .ghead,
    .stb,
    .empty,
    .cal,
    .chart-wrap {
      border-radius: var(--r)
    }

    .panel,
    .detail-head {
      border-color: var(--line)
    }

    .detail-head {
      padding: 1.2rem
    }

    .dh-title {
      font-weight: 800;
      letter-spacing: -.04em
    }

    .kpi .v,
    .mcard .v {
      font-weight: 800;
      letter-spacing: -.035em
    }

    .kpi .k,
    .mcard .k {
      font-weight: 500
    }

    .kv {
      border-radius: var(--r)
    }

    .ic-n,
    [data-theme=dark] .ic-n {
      background: var(--primary-50);
      color: var(--primary);
      font-weight: 800
    }

    .ic-sq {
      border-radius: var(--r)
    }

    .g-ic,
    [data-theme=dark] .g-ic {
      background: var(--primary);
      color: var(--on-primary);
      font-weight: 800
    }

    .avatar {
      font-weight: 750
    }

    .empty-ic {
      color: var(--primary);
      background: var(--primary-50);
      border: 0
    }

    /* ---------- controls ---------- */
    .chip.on,
    [data-theme=dark] .chip.on {
      background: var(--primary);
      border-color: var(--primary);
      color: var(--on-primary)
    }

    .chip.on .n,
    [data-theme=dark] .chip.on .n {
      color: var(--on-primary);
      opacity: .75
    }

    .seg button.on,
    .langs button.on,
    .seg2 button.on,
    [data-theme=dark] .seg button.on,
    [data-theme=dark] .langs button.on {
      background: var(--primary);
      border-color: var(--primary);
      color: var(--on-primary)
    }

    .stseg button.on,
    [data-theme=dark] .stseg button.on {
      background: var(--surface);
      color: var(--primary);
      border: 1px solid var(--line)
    }

    .stseg button[data-status=Ready].on {
      color: var(--success)
    }

    .btn {
      font-weight: 650;
      letter-spacing: -.01em
    }

    .btn-primary,
    [data-theme=dark] .btn-primary {
      background: var(--primary);
      color: var(--on-primary)
    }

    .btn-primary:hover,
    [data-theme=dark] .btn-primary:hover {
      background: var(--primary-600)
    }

    .btn-accent {
      background: var(--accent);
      color: #2A1A02
    }

    .input:focus,
    .select:focus,
    .textarea:focus,
    .search input:focus {
      border-color: var(--primary);
      outline: 3px solid var(--primary-50);
      outline-offset: 0
    }

    .mic {
      background: var(--primary-50);
      color: var(--primary)
    }

    .pk-sel {
      border-color: var(--primary);
      background: var(--primary-50)
    }

    input[type=checkbox] {
      accent-color: var(--primary)
    }

    .search input {
      height: 3rem;
      font-size: 1rem
    }

    /* ---------- order detail extras ---------- */
    .paybar {
      height: .45rem;
      display: flex;
      gap: 2px;
      margin: .9rem 0 .2rem
    }

    .paybar span {
      display: block;
      height: 100%;
      border-radius: var(--r-sm)
    }

    .paybar .pb-p {
      background: var(--success)
    }

    .paybar .pb-d {
      background: var(--line)
    }

    .paycap {
      display: flex;
      justify-content: space-between;
      font-size: .78rem;
      color: var(--muted);
      font-weight: 500
    }

    /* ---------- nav ---------- */
    .nav,
    [data-theme=dark] .nav {
      background: var(--nav);
      border-top: 1px solid var(--line)
    }

    .nav button.tab.on,
    [data-theme=dark] .nav button.tab.on {
      color: var(--nav-on)
    }

    .nav button.tab.on .ni {
      background: var(--nav-pill)
    }

    .nav .plus,
    [data-theme=dark] .nav .plus {
      background: var(--accent);
      color: #2A1A02
    }

    .nav-ind {
      background: var(--primary)
    }

    .nv-brand,
    .pl-t {
      display: none
    }

    /* ---------- sheets / toast ---------- */
    .sheet-head h3 {
      font-weight: 800;
      letter-spacing: -.03em
    }

    .cg:first-child {
      background: var(--primary);
      border-color: var(--primary);
      color: var(--on-primary)
    }

    .cg .ic-sq {
      background: var(--primary-50);
      color: var(--primary)
    }

    .toast svg {
      color: #7EE0B0
    }

    /* ---------- wide screens: sidebar layout ---------- */
    @media (min-width:960px) {

      .nav,
      [data-theme=dark] .nav {
        top: 0;
        bottom: 0;
        right: auto;
        width: 15.5rem;
        border-top: 0;
        border-right: 1px solid var(--line);
        padding: 1rem .8rem
      }

      .nav-inner {
        display: flex;
        flex-direction: column;
        align-items: stretch;
        gap: .2rem;
        max-width: none
      }

      .nv-brand {
        order: -2;
        display: flex;
        align-items: center;
        gap: .6rem;
        font-weight: 800;
        font-size: 1.1rem;
        letter-spacing: -.03em;
        padding: .3rem .5rem 1.2rem
      }

      .nv-brand i {
        width: 2.1rem;
        height: 2.1rem;
        border-radius: var(--r);
        background: var(--primary);
        color: var(--on-primary);
        display: grid;
        place-items: center
      }

      .nav .plus,
      [data-theme=dark] .nav .plus {
        order: -1;
        width: 100%;
        height: 2.9rem;
        justify-self: auto;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: .5rem;
        margin-bottom: .9rem
      }

      .pl-t {
        display: inline;
        font-weight: 700
      }

      .nav button.tab {
        flex-direction: row;
        justify-content: flex-start;
        height: 2.9rem;
        gap: .7rem;
        padding: 0 .5rem;
        border-radius: var(--r);
        font-size: .95rem
      }

      .nav button.tab span {
        padding: 0
      }

      .nav button.tab .ni {
        width: 2.2rem;
        height: 2.2rem
      }

      .nav button.tab.on {
        background: var(--nav-pill)
      }

      .nav button.tab.on .ni {
        background: transparent
      }

      .nav .badge {
        position: static;
        margin-left: auto
      }

      .nav-ind {
        display: none
      }

      .app {
        max-width: none;
        margin-left: 15.5rem;
        padding-bottom: 3rem
      }

      .topbar,
      main {
        max-width: 760px;
        margin-left: auto;
        margin-right: auto
      }

      .toast {
        bottom: 1.5rem;
        margin-left: 7.75rem
      }

      .selbar {
        left: 15.5rem
      }

      .topbar .brand>* {
        display: none
      }
    }

    /* ---------- order header ---------- */
    .ohead {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--r);
      padding: 1rem
    }

    .oh-top {
      display: flex;
      align-items: center;
      gap: .45rem
    }

    .oh-no {
      font-size: .75rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .1em;
      color: var(--muted);
      flex: 1
    }

    .oh-cust {
      display: flex;
      align-items: center;
      gap: .7rem;
      margin-top: .9rem
    }

    .oh-cust .or-av {
      width: 3rem;
      height: 3rem;
      font-size: 1rem
    }

    .oh-cm {
      flex: 1;
      min-width: 0;
      text-align: left
    }

    .oh-cm .dh-title {
      font-size: 1.35rem;
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    .oh-sub {
      font-size: .84rem;
      color: var(--muted)
    }

    .oh-ic {
      width: 2.6rem;
      height: 2.6rem;
      border: 1px solid var(--line);
      border-radius: var(--r);
      display: grid;
      place-items: center;
      color: var(--primary);
      flex-shrink: 0;
      transition: border-color .15s, transform .15s var(--ease)
    }

    .oh-ic.wa {
      color: #1C9D50
    }

    .oh-ic:hover {
      border-color: var(--primary)
    }

    .oh-ic:active {
      transform: scale(.92)
    }

    .oh-items {
      display: flex;
      align-items: center;
      gap: .45rem;
      margin-top: .9rem;
      padding: .65rem .75rem;
      background: var(--surface-2);
      border: 1px solid var(--line-2);
      border-radius: var(--r);
      font-size: .92rem;
      font-weight: 500
    }

    .oh-items svg {
      color: var(--primary)
    }

    .oh-items span {
      flex: 1;
      min-width: 0
    }

    .oh-items b {
      font-weight: 800;
      letter-spacing: -.02em
    }

    .oh-dates {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      margin-top: .75rem
    }

    .oh-dates>div {
      padding: .1rem .6rem;
      border-left: 1px solid var(--line-2)
    }

    .oh-dates>div:first-child {
      border-left: 0;
      padding-left: 0
    }

    .oh-dates .k {
      font-size: .72rem;
      color: var(--muted);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .06em
    }

    .oh-dates .v {
      font-weight: 700;
      margin-top: .1rem
    }

    .oh-dates .v.danger {
      color: var(--danger)
    }

    .oh-dates .v.warn {
      color: var(--accent-ink)
    }

    .oh-due {
      margin-top: .75rem;
      font-weight: 600;
      font-size: .88rem;
      display: flex;
      align-items: center;
      gap: .35rem
    }

    .item-line {
      background: var(--surface-2);
      border: 1px solid var(--line-2);
      border-radius: var(--r);
      padding: .75rem;
      margin-bottom: .6rem
    }

    /* =====================================================================
   v9 — Minimal. One colour (indigo) + neutrals. 2–4px radius. No shadows, no gradients. Quiet motion.
   ===================================================================== */
    :root {
      --bg: #FAFAFA;
      --surface: #FFFFFF;
      --surface-2: #F5F5F6;
      --ink: #18181B;
      --muted: #6B6B73;
      --faint: #A1A1AA;
      --line: #E7E7EA;
      --line-2: #F0F0F2;
      --primary: #3B5BDB;
      --primary-600: #3049B8;
      --primary-50: #EEF1FC;
      --on-primary: #FFFFFF;
      --accent: var(--primary);
      --accent-ink: var(--primary);
      --accent-50: var(--primary-50);
      --success: var(--primary);
      --success-50: var(--primary-50);
      --info: var(--primary);
      --info-50: var(--primary-50);
      --violet: var(--primary);
      --violet-50: var(--primary-50);
      --danger: #C0392B;
      --danger-50: #FBEDEB;
      --c1: #3B5BDB;
      --c2: #C4C7D0;
      --nav: #FFFFFF;
      --nav-ink: #A1A1AA;
      --nav-on: #3B5BDB;
      --nav-pill: transparent;
    }

    [data-theme=dark] {
      --bg: #0E0E10;
      --surface: #151518;
      --surface-2: #1B1B1F;
      --ink: #EDEDF0;
      --muted: #9B9BA4;
      --faint: #62626B;
      --line: #26262B;
      --line-2: #1E1E22;
      --primary: #8EA4FF;
      --primary-600: #A9BAFF;
      --primary-50: #1C2238;
      --on-primary: #0E0E10;
      --accent: var(--primary);
      --accent-ink: var(--primary);
      --accent-50: var(--primary-50);
      --success: var(--primary);
      --success-50: var(--primary-50);
      --info: var(--primary);
      --info-50: var(--primary-50);
      --violet: var(--primary);
      --violet-50: var(--primary-50);
      --danger: #EF7D70;
      --danger-50: #2E1A18;
      --c1: #8EA4FF;
      --c2: #3A3A42;
      --nav: #151518;
      --nav-ink: #62626B;
      --nav-on: #8EA4FF;
      --nav-pill: transparent;
    }

    html,
    body {
      letter-spacing: -.008em
    }

    main {
      padding: .25rem 1.1rem 2rem
    }

    /* quiet type scale */
    .topbar {
      background: var(--bg);
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
      min-height: 3.6rem
    }

    .topbar h2 {
      font-size: 1.05rem;
      font-weight: 650
    }

    .topbar.big h2 {
      font-size: 1.45rem;
      font-weight: 700;
      letter-spacing: -.03em
    }

    .brand-mark {
      background: var(--primary);
      color: var(--on-primary);
      width: 2rem;
      height: 2rem
    }

    .brand-name {
      font-weight: 700;
      font-size: 1.05rem
    }

    .brand-name span {
      color: var(--primary)
    }

    [data-theme=dark] .brand-name span {
      color: var(--primary)
    }

    .section {
      margin-top: 1.75rem
    }

    .section-head {
      margin-bottom: .55rem
    }

    .section-title {
      font-size: .75rem;
      font-weight: 650;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--muted);
      gap: .4rem
    }

    .section-title>svg {
      display: none
    }

    .sc-n {
      background: none;
      padding: 0;
      color: var(--faint);
      font-size: .75rem
    }

    .link {
      color: var(--primary);
      font-weight: 600;
      font-size: .85rem
    }

    .hint {
      color: var(--muted)
    }

    /* ---------- home ---------- */
    .hm-head {
      padding: .6rem 0 1.1rem
    }

    .hm-date {
      font-size: .85rem;
      color: var(--muted)
    }

    .hm-title {
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -.035em;
      margin-top: .1rem
    }

    .sum {
      display: block;
      width: 100%;
      text-align: left;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--r);
      padding: 0;
      transition: border-color .15s
    }

    .sum:hover {
      border-color: var(--faint)
    }

    .sum-row {
      display: grid;
      grid-template-columns: 1.3fr 1fr 1fr
    }

    .sum-c {
      display: flex;
      flex-direction: column;
      padding: .95rem 1rem;
      border-right: 1px solid var(--line-2);
      min-width: 0
    }

    .sum-c:last-child {
      border-right: 0
    }

    .sum-c .v {
      font-size: 1.45rem;
      font-weight: 700;
      letter-spacing: -.03em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    .sum-c:first-child .v {
      color: var(--primary)
    }

    .sum-c .k {
      font-size: .78rem;
      color: var(--muted);
      margin-top: .1rem
    }

    .sum-more {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: .6rem 1rem;
      border-top: 1px solid var(--line-2);
      font-size: .85rem;
      font-weight: 600;
      color: var(--primary)
    }

    .acts {
      display: grid;
      grid-template-columns: 1.4fr 1fr;
      gap: .5rem;
      margin-top: .75rem
    }

    .acts .btn {
      height: 3.1rem
    }

    .wlist {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--r)
    }

    .wrow {
      display: flex;
      align-items: center;
      gap: .6rem;
      padding: 0 .8rem 0 0;
      border-bottom: 1px solid var(--line-2)
    }

    .wrow:last-child {
      border-bottom: 0
    }

    .wr-main {
      flex: 1;
      min-width: 0;
      text-align: left;
      padding: .8rem .95rem;
      display: flex;
      flex-direction: column;
      gap: .1rem;
      border-radius: 0
    }

    .wr-main:hover {
      background: var(--surface-2)
    }

    .wr-t {
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    .wr-no {
      color: var(--faint);
      font-weight: 500;
      font-size: .85rem
    }

    .wr-s {
      font-size: .84rem;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    .wr-act {
      flex-shrink: 0;
      height: 2.2rem;
      padding: 0 .8rem;
      border: 1px solid var(--line);
      border-radius: var(--r);
      font-size: .82rem;
      font-weight: 600;
      color: var(--ink);
      background: var(--surface);
      transition: border-color .15s, background .15s
    }

    .wr-act:hover {
      border-color: var(--primary);
      color: var(--primary)
    }

    .wr-act.on {
      background: var(--primary);
      border-color: var(--primary);
      color: var(--on-primary)
    }

    .calm {
      display: flex;
      align-items: center;
      gap: .8rem;
      padding: 1rem;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--r);
      color: var(--primary)
    }

    .calm b {
      display: block;
      color: var(--ink);
      font-weight: 600
    }

    .calm span {
      display: block;
      color: var(--muted);
      font-size: .86rem
    }

    .lrows {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--r);
      overflow: hidden
    }

    .lrow {
      display: flex;
      align-items: center;
      gap: .6rem;
      width: 100%;
      padding: .85rem .95rem;
      border-bottom: 1px solid var(--line-2);
      border-radius: 0;
      text-align: left;
      font-size: .95rem;
      color: var(--ink)
    }

    .lrow:last-child {
      border-bottom: 0
    }

    .lrow:hover {
      background: var(--surface-2)
    }

    .lrow>span {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: center;
      gap: .6rem
    }

    .lrow>span svg {
      color: var(--muted)
    }

    .lrow>b {
      font-weight: 650
    }

    .lrow>svg {
      color: var(--faint)
    }

    .lrow-danger,
    .lrow-danger>span svg {
      color: var(--danger)
    }

    /* ---------- rows: orders & customers ---------- */
    .list.rows {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--r)
    }

    .card.orow,
    .card.crow {
      padding: .8rem .95rem;
      gap: .75rem
    }

    .order-card.orow::before {
      display: none
    }

    .or-av,
    [data-theme=dark] .or-av {
      width: 2.3rem;
      height: 2.3rem;
      font-size: .8rem;
      font-weight: 650;
      background: var(--surface-2);
      color: var(--muted);
      border: 1px solid var(--line-2)
    }

    .or-l1 b {
      font-weight: 600;
      font-size: .98rem
    }

    .or-no {
      color: var(--faint);
      font-size: .82rem;
      font-weight: 500;
      flex-shrink: 0
    }

    .or-urg {
      font-size: .68rem;
      font-weight: 650;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: var(--primary);
      border: 1px solid var(--primary);
      padding: 0 .3rem;
      border-radius: var(--r-sm);
      flex-shrink: 0
    }

    .or-l2 {
      font-size: .84rem;
      color: var(--muted);
      display: block
    }

    .or-amt {
      font-size: .85rem;
      font-weight: 600;
      color: var(--ink)
    }

    .or-k {
      font-size: .72rem;
      color: var(--muted)
    }

    .or-end {
      gap: .25rem
    }

    .grp-h {
      font-size: .72rem;
      font-weight: 650;
      letter-spacing: .08em;
      color: var(--muted)
    }

    .g-late .grp-h,
    .g-today .grp-h,
    [data-theme=dark] .g-today .grp-h {
      color: var(--ink)
    }

    .card.orow:hover,
    .card.crow:hover {
      background: var(--surface-2)
    }

    /* ---------- status: one colour, three weights ---------- */
    .pill,
    [data-theme=dark] .pill {
      background: transparent;
      border: 1px solid var(--line);
      color: var(--muted);
      font-size: .72rem;
      font-weight: 600;
      padding: .1rem .45rem
    }

    .pill::before {
      display: none
    }

    .pill.s-received {
      color: var(--ink)
    }

    .pill.s-ready {
      background: var(--primary);
      border-color: var(--primary);
      color: var(--on-primary)
    }

    .pill.s-delivered {
      color: var(--faint)
    }

    .pill.s-cancelled {
      color: var(--danger);
      border-color: var(--danger-50)
    }

    .due {
      color: var(--muted)
    }

    .due.danger {
      color: var(--ink);
      font-weight: 650
    }

    .due.warn {
      color: var(--primary);
      font-weight: 600
    }

    .bal {
      color: var(--ink)
    }

    .tag,
    .tag-urgent,
    .tag-vip,
    .tag-wholesale,
    .tag-low,
    .tag-ok,
    .tag-stuck,
    .tag-muted {
      background: transparent;
      border: 1px solid var(--line);
      color: var(--muted)
    }

    .tag-urgent {
      color: var(--primary);
      border-color: var(--primary)
    }

    /* ---------- order page ---------- */
    .oh {
      padding: .4rem 0 .2rem
    }

    .oh-l1 {
      display: flex;
      align-items: center;
      gap: .4rem
    }

    .oh-no {
      margin-left: auto;
      font-size: .85rem;
      color: var(--faint);
      font-weight: 500
    }

    .oh-name {
      display: flex;
      align-items: center;
      gap: .25rem;
      font-size: 1.55rem;
      font-weight: 700;
      letter-spacing: -.035em;
      margin-top: .55rem;
      text-align: left
    }

    .oh-name svg {
      color: var(--faint)
    }

    .oh-sub {
      color: var(--muted);
      margin-top: .1rem
    }

    .oh-meta {
      display: flex;
      flex-wrap: wrap;
      gap: .35rem .9rem;
      font-size: .85rem;
      color: var(--muted);
      margin-top: .55rem
    }

    .oh-contact {
      display: flex;
      gap: .5rem;
      margin-top: .85rem
    }

    .oh-contact a {
      display: inline-flex;
      align-items: center;
      gap: .35rem;
      height: 2.3rem;
      padding: 0 .8rem;
      border: 1px solid var(--line);
      border-radius: var(--r);
      font-size: .85rem;
      font-weight: 600;
      color: var(--ink);
      text-decoration: none;
      background: var(--surface)
    }

    .oh-contact a svg {
      color: var(--primary)
    }

    .stseg {
      background: var(--surface-2);
      border-color: var(--line)
    }

    .stseg button.on,
    [data-theme=dark] .stseg button.on,
    .stseg button[data-status=Ready].on {
      background: var(--surface);
      color: var(--primary);
      border: 1px solid var(--line);
      animation: none
    }

    .plist {
      padding: 0 1rem
    }

    .prow {
      display: flex;
      align-items: center;
      gap: .6rem;
      width: 100%;
      padding: .75rem 0;
      border-bottom: 1px solid var(--line-2);
      text-align: left;
      border-radius: 0;
      min-height: 3.2rem
    }

    .prow:last-child {
      border-bottom: 0
    }

    .pl {
      color: var(--muted);
      font-size: .9rem;
      flex: 1
    }

    .pv {
      font-weight: 600
    }

    .prow .inline-select {
      max-width: 60%
    }

    .prow-btn svg {
      color: var(--faint)
    }

    .plist .qc {
      margin: .25rem 0 .9rem;
      border-radius: var(--r)
    }

    .pay-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: .75rem
    }

    .pay-v {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -.03em
    }

    .pay-k {
      font-size: .82rem;
      color: var(--muted)
    }

    .paybar {
      height: 4px;
      margin: .85rem 0 0
    }

    .paybar .pb-p {
      background: var(--primary)
    }

    .paybar .pb-d {
      background: var(--line-2)
    }

    .item-line {
      background: var(--surface);
      border: 1px solid var(--line);
      margin-bottom: .5rem
    }

    .stylechips .sc {
      background: var(--surface-2);
      border: 0
    }

    .acc {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--r)
    }

    .acc summary {
      list-style: none;
      cursor: pointer;
      padding: .85rem .95rem;
      font-size: .75rem;
      font-weight: 650;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--muted);
      display: flex;
      gap: .4rem;
      align-items: center
    }

    .acc summary::-webkit-details-marker {
      display: none
    }

    .acc summary::after {
      content: "";
      margin-left: auto;
      width: .42rem;
      height: .42rem;
      border-right: 1.5px solid var(--faint);
      border-bottom: 1.5px solid var(--faint);
      transform: rotate(45deg);
      transition: transform .2s
    }

    .acc[open] summary::after {
      transform: rotate(-135deg)
    }

    .acc .timeline {
      padding: 0 .95rem .9rem
    }

    .missing {
      border-style: solid;
      background: var(--surface)
    }

    /* ---------- customer page ---------- */
    .cp {
      padding: .4rem 0 0
    }

    .cp-name {
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: -.035em
    }

    .cp-sub {
      color: var(--muted);
      font-size: .9rem;
      margin-top: .15rem
    }

    .cp-stats {
      display: flex;
      gap: 1.1rem;
      margin-top: .8rem;
      font-size: .88rem;
      color: var(--muted)
    }

    .cp-stats b {
      color: var(--ink);
      font-weight: 650
    }

    .cp-due b {
      color: var(--primary)
    }

    .cp-acts {
      display: grid;
      grid-template-columns: 1.3fr 1fr auto auto;
      gap: .45rem;
      margin-top: 1rem
    }

    .cp-ic {
      width: 3.2rem;
      padding: 0
    }

    .cp-ic svg {
      color: var(--primary)
    }

    .utabs {
      top: 3.6rem;
      margin-top: 1.4rem
    }

    .utabs button.on {
      color: var(--ink);
      border-bottom-color: var(--primary)
    }

    .utabs button.on span {
      color: var(--primary)
    }

    /* ---------- generic surfaces: calmer ---------- */
    .card,
    .panel,
    .agenda,
    .mcard,
    .kpi,
    .todo,
    .glist,
    .ghead,
    .empty,
    .detail-head,
    .tile,
    .mgrp,
    .shop-card,
    .prof,
    .ohead,
    .wl {
      background: var(--surface);
      border: 1px solid var(--line)
    }

    .kpi .v,
    .mcard .v {
      font-weight: 700
    }

    .ic-sq,
    .tile .ic-sq,
    .tile.mrow .ic-sq,
    .setrow .ic-sq,
    .ag-kind,
    .ag-kind.k-del,
    .ag-kind.k-late,
    .ag-kind.k-trial,
    .stb-ic,
    .g-ic,
    [data-theme=dark] .g-ic {
      background: var(--surface-2);
      color: var(--ink);
      border: 0
    }

    .ic-n,
    [data-theme=dark] .ic-n {
      background: var(--surface-2);
      color: var(--muted)
    }

    .avatar {
      background: var(--surface-2) !important;
      color: var(--muted) !important
    }

    .alert,
    .alert i,
    .alert.a-red i,
    .alert.a-green i,
    .alert.a-violet i,
    .alert.a-amber i {
      color: var(--ink)
    }

    .mr-b {
      background: transparent;
      color: var(--primary);
      border: 1px solid var(--primary)
    }

    .cr-act {
      background: transparent;
      color: var(--primary)
    }

    .empty-ic {
      background: var(--surface-2);
      color: var(--faint)
    }

    .btn-wa {
      background: var(--surface);
      color: var(--ink);
      border: 1px solid var(--line)
