    }

    .btn-wa svg {
      color: #1C9D50
    }

    .btn-accent {
      background: var(--primary);
      color: var(--on-primary)
    }

    .entry .amt.in {
      color: var(--ink)
    }

    .entry .amt.out {
      color: var(--muted)
    }

    .shop-card .brand-mark {
      background: var(--primary)
    }

    /* ---------- controls ---------- */
    .chip {
      border-color: var(--line);
      color: var(--muted)
    }

    .chip.on,
    [data-theme=dark] .chip.on {
      background: var(--ink);
      border-color: var(--ink);
      color: var(--bg)
    }

    .chip.on .n,
    [data-theme=dark] .chip.on .n {
      color: var(--bg)
    }

    .seg button.on,
    .langs button.on,
    .seg2 button.on,
    [data-theme=dark] .seg button.on,
    [data-theme=dark] .langs button.on {
      background: var(--ink);
      border-color: var(--ink);
      color: var(--bg);
      animation: none
    }

    .mic {
      background: transparent;
      color: var(--muted)
    }

    .mic:hover {
      color: var(--primary)
    }

    .input,
    .select,
    .textarea {
      background: var(--surface)
    }

    .input:focus,
    .select:focus,
    .textarea:focus,
    .search input:focus {
      outline: 3px solid var(--primary-50)
    }

    .pk-sel {
      background: var(--surface-2);
      border-color: var(--line)
    }

    .switch.on {
      background: var(--primary)
    }

    /* ---------- create sheet ---------- */
    .create-list {
      border: 0
    }

    .lrow.cr {
      padding: .85rem .2rem
    }

    .cr-ic {
      width: 2.5rem;
      height: 2.5rem;
      border-radius: var(--r);
      display: grid;
      place-items: center;
      background: var(--surface-2);
      color: var(--ink);
      flex: none !important
    }

    .create-list .lrow.cr:first-child .cr-ic {
      background: var(--primary);
      color: var(--on-primary)
    }

    .cr-t {
      display: flex;
      flex-direction: column !important;
      align-items: flex-start !important;
      gap: 0 !important
    }

    .cr-t b {
      font-weight: 600
    }

    .cr-t small {
      color: var(--muted);
      font-size: .8rem
    }

    /* ---------- nav ---------- */
    .nav,
    [data-theme=dark] .nav {
      background: var(--nav);
      border-top: 1px solid var(--line)
    }

    .nav button.tab.on .ni,
    .nav button.tab .ni {
      background: transparent
    }

    .nav button.tab.on,
    [data-theme=dark] .nav button.tab.on {
      color: var(--nav-on)
    }

    .nav .plus,
    [data-theme=dark] .nav .plus {
      background: var(--primary);
      color: var(--on-primary);
      width: 3rem;
      height: 3rem
    }

    .nav .badge {
      background: var(--primary);
      color: var(--on-primary)
    }

    .nav-ind {
      display: none
    }

    @media (min-width:960px) {
      .nav button.tab.on {
        background: var(--primary-50)
      }
    }

    /* ---------- motion: quiet ---------- */
    #view.vt,
    #view.vf,
    #view.vb {
      animation: fadeIn .18s ease-out
    }

    @keyframes fadeIn {
      from {
        opacity: 0
      }

      to {
        opacity: 1
      }
    }

    .rise,
    .create-grid .cg,
    .pk-sel,
    .err.show,
    .seg button.on,
    input[type=checkbox]:checked {
      animation: none
    }

    .live {
      display: none
    }

    .toast {
      background: var(--ink);
      color: var(--bg)
    }

    .toast svg,
    [data-theme=dark] .toast svg {
      color: var(--primary)
    }

    .toast.show svg path,
    .toast.show svg polyline {
      animation: none;
      stroke-dasharray: none
    }

    .or-l2 .due,
    .wr-s .due {
      display: inline;
      font-size: inherit
    }

    .cr-ic svg,
    .lrow>span.cr-ic svg {
      color: var(--ink)
    }

    .create-list .lrow.cr:first-child .cr-ic svg {
      color: var(--on-primary)
    }

    .oh-no {
      display: none
    }

    .icon-btn .dotb {
      background: var(--primary);
      color: var(--on-primary)
    }

    /* =====================================================================
   v10 — TrueFit. One colour: emerald. Minimal, flat, 2–4px radius.
   ===================================================================== */
    :root {
      --primary: #0E8A62;
      --primary-600: #0A7050;
      --primary-50: #E8F5EF;
      --on-primary: #FFFFFF;
      --c1: #0E8A62;
      --nav-on: #0E8A62;
    }

    [data-theme=dark] {
      --primary: #3CCB94;
      --primary-600: #62D9AA;
      --primary-50: #112A20;
      --on-primary: #06150F;
      --c1: #3CCB94;
      --nav-on: #3CCB94;
    }

    /* ---------- logo ---------- */
    .tf-mark {
      width: 2.1rem;
      height: 2.1rem;
      border-radius: var(--r);
      background: var(--primary);
      color: var(--on-primary);
      display: grid;
      place-items: center;
      flex-shrink: 0
    }

    .tf-mark svg {
      width: 62%;
      height: 62%
    }

    .tf-mark.lg {
      width: 3rem;
      height: 3rem
    }

    .tf-mark.xl {
      width: 4.2rem;
      height: 4.2rem
    }

    /* ---------- home header ---------- */
    .hh {
      display: flex;
      align-items: center;
      gap: .7rem;
      flex: 1;
      min-width: 0
    }

    .hh-t {
      min-width: 0
    }

    .hh-g {
      font-weight: 700;
      font-size: 1.08rem;
      letter-spacing: -.02em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    .hh-s {
      font-size: .8rem;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    .topbar {
      min-height: 3.9rem
    }

    .sum {
      cursor: default
    }

    .sum-h {
      font-size: .72rem;
      font-weight: 650;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--muted);
      padding: .75rem 1rem 0
    }

    .sum-c {
      padding: .45rem 1rem .9rem
    }

    .sum:hover {
      border-color: var(--line)
    }

    main {
      padding-top: .75rem
    }

    /* ---------- bottom navigation ---------- */
    .nav,
    [data-theme=dark] .nav {
      background: var(--surface);
      border-top: 1px solid var(--line)
    }

    .nav-inner {
      padding: .35rem .4rem calc(.35rem + env(safe-area-inset-bottom))
    }

    .nav button.tab,
    [data-theme=dark] .nav button.tab {
      height: 3.6rem;
      gap: .25rem;
      color: var(--faint);
      font-size: .72rem;
      font-weight: 550
    }

    .nav button.tab .ni {
      width: 3.3rem;
      height: 1.95rem;
      border-radius: var(--r);
      display: grid;
      place-items: center;
      transition: background .18s ease, color .18s ease
    }

    .nav button.tab.on,
    [data-theme=dark] .nav button.tab.on {
      color: var(--ink);
      font-weight: 650
    }

    .nav button.tab.on .ni,
    [data-theme=dark] .nav button.tab.on .ni {
      background: var(--primary);
      color: var(--on-primary)
    }

    .nav .plus,
    [data-theme=dark] .nav .plus {
      width: 3.3rem;
      height: 3.3rem;
      border-radius: var(--r);
      background: var(--ink);
      color: var(--bg)
    }

    .nav .plus:active {
      transform: scale(.94)
    }

    .nav .badge {
      top: .25rem;
      left: calc(50% + .55rem);
      background: var(--ink);
      color: var(--bg)
    }

    .nv-brand .tf-mark {
      width: 2rem;
      height: 2rem
    }

    .nv-brand b {
      color: var(--primary);
      font-weight: 800
    }

    @media (min-width:960px) {
      .nav button.tab {
        height: 2.9rem
      }

      .nav button.tab.on {
        background: var(--primary-50)
      }

      .nav button.tab.on .ni {
        background: transparent;
        color: var(--primary)
      }

      .nav .plus,
      [data-theme=dark] .nav .plus {
        background: var(--primary);
        color: var(--on-primary);
        width: 100%
      }
    }

    /* ---------- create sheet: centred icons ---------- */
    .lrow.cr>.cr-ic,
    .cr-ic {
      display: grid !important;
      place-items: center;
      justify-content: center;
      align-items: center;
      width: 2.6rem;
      height: 2.6rem;
      flex: 0 0 2.6rem !important;
      gap: 0 !important
    }

    .cr-ic svg {
      display: block;
      margin: 0
    }

    /* ---------- order form: measurement gate ---------- */
    .ofmiss {
      display: flex;
      gap: .75rem;
      align-items: flex-start;
      padding: .9rem;
      border: 1px solid var(--primary);
      background: var(--primary-50);
      border-radius: var(--r);
      margin: .75rem 0 0;
      color: var(--primary)
    }

    .ofmiss b {
      color: var(--ink);
      display: block
    }

    .ofmiss p {
      color: var(--muted);
      font-size: .88rem;
      margin: .15rem 0 .6rem
    }

    .ofmiss .btn {
      margin: 0 .4rem .4rem 0
    }

    .hint.warn {
      color: var(--primary);
      font-weight: 600
    }

    /* ---------- sort sheet ---------- */
    .sortlist .lrow {
      justify-content: space-between
    }

    .sortlist .lrow.on {
      color: var(--primary);
      font-weight: 650
    }

    .sortlist .lrow.on svg {
      color: var(--primary)
    }

    /* ---------- staff ---------- */
    .srow {
      display: flex;
      align-items: center;
      border-bottom: 1px solid var(--line-2);
      padding-right: .8rem
    }

    .srow:last-child {
      border-bottom: 0
    }

    .srow .card.crow {
      border: 0;
      border-radius: 0;
      flex: 1;
      min-width: 0
    }

    .srow.off {
      opacity: .55
    }

    .srow .wr-act {
      display: inline-flex;
      align-items: center;
      gap: .25rem
    }

    .cp-acts.st {
      grid-template-columns: 1fr 1fr auto
    }

    .rates {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(8rem, 1fr));
      gap: .5rem
    }

    .rates>div {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--r);
      padding: .65rem .8rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: .9rem
    }

    .rates b {
      font-weight: 650
    }

    .rate-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: .5rem;
      margin-bottom: .35rem
    }

    .rate-in {
      display: flex;
      flex-direction: column;
      gap: .25rem;
      font-size: .85rem;
      color: var(--muted);
      font-weight: 500
    }

    .went {
      display: flex;
      align-items: center;
      gap: .6rem;
      padding: .7rem .4rem .7rem .95rem;
      border-bottom: 1px solid var(--line-2)
    }

    .went:last-child {
      border-bottom: 0
    }

    .we-d {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column
    }

    .we-d b {
      font-weight: 600;
      font-size: .92rem
    }

    .we-d span {
      font-size: .84rem;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    .we-v {
      font-weight: 650;
      font-size: .92rem
    }

    .wqty {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--r)
    }

    .wq {
      display: flex;
      align-items: center;
      gap: .6rem;
      padding: .65rem .8rem;
      border-bottom: 1px solid var(--line-2)
    }

    .wq:last-child {
      border-bottom: 0
    }

    .wq-t {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column
    }

    .wq-t b {
      font-weight: 600
    }

    .wq-t span {
      font-size: .8rem;
      color: var(--muted)
    }

    .wq .stepper-q {
      display: flex;
      align-items: center;
      gap: .3rem
    }

    .wq .stepper-q button {
      width: 2.4rem;
      height: 2.4rem;
      border: 1px solid var(--line);
      border-radius: var(--r);
      display: grid;
      place-items: center;
      background: var(--surface)
    }

    .wq .stepper-q .input {
      width: 3.6rem;
      height: 2.4rem;
      text-align: center;
      padding: 0 .3rem;
      font-weight: 650
    }

    .wtotal {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: .9rem;
      padding: .75rem .9rem;
      background: var(--surface-2);
      border-radius: var(--r);
      font-weight: 600
    }

    .wtotal b {
      font-size: 1.15rem;
      color: var(--primary)
    }

    /* ---------- guide ---------- */
    .guide {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--r)
    }

    .gstep {
      display: flex;
      gap: .85rem;
      padding: .9rem 1rem;
      border-bottom: 1px solid var(--line-2)
    }

    .gstep:last-child {
      border-bottom: 0
    }

    .gs-n {
      width: 1.8rem;
      height: 1.8rem;
      border-radius: var(--r-sm);
      background: var(--primary-50);
      color: var(--primary);
      display: grid;
      place-items: center;
      font-weight: 700;
      font-size: .85rem;
      flex-shrink: 0
    }

    .gstep b {
      font-weight: 650
    }

    .gstep p {
      color: var(--muted);
      font-size: .9rem;
      margin-top: .15rem;
      line-height: 1.5
    }

    /* ---------- splash ---------- */
    .splash {
      position: fixed;
      inset: 0;
      z-index: 200;
      background: var(--bg);
      display: none;
      align-items: center;
      justify-content: center
    }

    .splash.open {
      display: flex
    }

    .splash.out {
      opacity: 0;
      transition: opacity .25s ease;
      pointer-events: none
    }

    .sp-in {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: .9rem;
      animation: spIn .5s ease-out both
    }

    .sp-name {
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: -.045em
    }

    .sp-name span,
    .ob-brand span,
    .brand-name span {
      color: var(--primary)
    }

    .sp-tag {
      color: var(--muted);
      font-size: .95rem
    }

    @keyframes spIn {
      from {
        opacity: 0;
        transform: translateY(6px)
      }

      to {
        opacity: 1;
        transform: none
      }
    }

    /* ---------- onboarding ---------- */
    .wiz {
      background: var(--bg)
    }

    .ob {
      max-width: 28rem;
      margin: 0 auto;
      min-height: 100%;
      display: flex;
      flex-direction: column;
      padding: 1.2rem 1.4rem calc(1.4rem + env(safe-area-inset-bottom))
    }

    .ob-top {
      display: flex;
      align-items: center;
      gap: .6rem
    }

    .ob-brand {
      font-weight: 800;
      font-size: 1.15rem;
      letter-spacing: -.03em;
      flex: 1
    }

    .ob-langs {
      display: flex;
      border: 1px solid var(--line);
      border-radius: var(--r);
      overflow: hidden
    }

    .ob-langs button {
      height: 2.1rem;
      padding: 0 .6rem;
      font-size: .8rem;
      font-weight: 600;
      color: var(--muted);
      border-radius: 0
    }

    .ob-langs button.on {
      background: var(--ink);
      color: var(--bg)
    }

    .ob-slide {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 2rem 0 1rem;
      animation: fadeIn .25s ease-out
    }

    .ob-art {
      width: 6.5rem;
      height: 6.5rem;
      border-radius: var(--r);
      background: var(--primary-50);
      color: var(--primary);
      display: grid;
      place-items: center;
      margin-bottom: 1.8rem
    }

    .ob-slide h1,
    .ob-form h1 {
      font-size: 1.85rem;
      font-weight: 800;
      letter-spacing: -.04em;
      line-height: 1.15
    }

    .ob-slide p {
      color: var(--muted);
      font-size: 1.05rem;
      margin-top: .6rem;
      line-height: 1.5;
      max-width: 22rem
    }

    .ob-dots {
      display: flex;
      gap: .35rem;
      margin: 1rem 0 1.2rem
    }

    .ob-dots i {
      width: .5rem;
      height: .5rem;
      border-radius: 1px;
      background: var(--line);
      transition: width .2s ease, background .2s ease
    }

    .ob-dots i.on {
      width: 1.4rem;
      background: var(--primary)
    }

    .ob-btns {
      display: grid;
      grid-template-columns: 1fr 1.6fr;
      gap: .5rem;
      margin-top: auto;
      padding-top: 1rem
    }

    .ob-btns .btn {
      height: 3.2rem
    }

    .ob-form {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding-top: 2rem;
      animation: fadeIn .25s ease-out
    }

    .ob-lead {
      color: var(--muted);
      margin: .4rem 0 1.4rem
    }

    .pin-in {
      letter-spacing: .6em;
      font-size: 1.3rem;
      text-align: center
    }

    .wiz .opt-card,
    .ob .opt-card {
      display: flex;
      align-items: center;
      gap: .75rem;
      width: 100%;
      text-align: left;
      border: 1px solid var(--line);
      background: var(--surface);
      padding: 1rem;
      margin-bottom: .5rem;
      border-radius: var(--r)
    }

    .ob .opt-card.on {
      border-color: var(--primary);
      background: var(--primary-50)
    }

    .ob .opt-card b {
      display: block
    }

    .ob .opt-card small {
      color: var(--muted);
      font-size: .87rem
    }

    .ob .radio {
      width: 1.1rem;
      height: 1.1rem;
      border: 2px solid var(--line);
      border-radius: 50%;
      flex-shrink: 0
    }

    .ob .radio {
      position: relative
    }

    .ob .opt-card.on .radio {
      border-color: var(--primary)
    }

    .ob .opt-card.on .radio::after {
      content: "";
      position: absolute;
      inset: 3px;
      border-radius: 50%;
      background: var(--primary)
    }

    /* ---------- sign in ---------- */
    .lock {
      background: var(--bg);
      justify-content: center;
      gap: 1.6rem
    }

    .si {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: .35rem
    }

    .si .tf-mark {
      margin-bottom: .7rem
    }

    .si-hi {
      font-size: 1.5rem;
      font-weight: 750;
      letter-spacing: -.035em
    }

    .si-shop {
      color: var(--muted)
    }

    .si p {
      margin: .6rem 0 .2rem;
      color: var(--muted);
      font-size: .92rem
    }

    .lock .pin-dots i {
      border-radius: 2px;
      border-color: var(--ink)
    }

    .lock .pin-dots i.f {
      background: var(--primary);
      border-color: var(--primary)
    }

    .lock .keypad button {
      border-radius: var(--r);
      background: var(--surface);
      border: 1px solid var(--line);
      color: var(--ink)
    }

    .lock .keypad button.ghost {
      background: transparent;
      border-color: transparent;
      color: var(--muted);
      font-size: .85rem
    }

    .lock .keypad button:active {
      background: var(--primary-50)
    }

    /* ===== v11 floating bottom bar: Home · Orders · Customers · More  +  Add ===== */
    .nav,
    [data-theme=dark] .nav {
      left: 0;
      right: 0;
      bottom: 0;
      background: transparent;
      border: 0;
      padding: 0 .75rem calc(.75rem + env(safe-area-inset-bottom));
      pointer-events: none
    }

    .nav-inner {
      display: flex;
      align-items: stretch;
      gap: .5rem;
      max-width: 560px;
      margin: 0 auto;
      padding: 0;
      pointer-events: none
    }

    .nv-tabs {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--r);
      padding: .3rem;
      pointer-events: auto
    }

    .nav button.tab,
    [data-theme=dark] .nav button.tab {
      height: 3.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: .15rem;
      border-radius: var(--r-sm);
      color: var(--faint);
      font-size: .7rem;
      font-weight: 600;
      position: relative;
      transition: background .18s ease, color .18s ease
    }

    .nav button.tab .ni,
    [data-theme=dark] .nav button.tab .ni,
    .nav button.tab.on .ni,
    [data-theme=dark] .nav button.tab.on .ni {
      width: auto;
      height: auto;
      background: transparent;
      color: inherit
    }

    .nav button.tab.on,
    [data-theme=dark] .nav button.tab.on {
      background: var(--primary-50);
      color: var(--primary)
    }

    .nav button.tab:active {
      transform: scale(.95)
    }

    .nav .badge {
      position: absolute;
      top: .35rem;
      left: calc(50% + .45rem);
      min-width: 1.05rem;
      height: 1.05rem;
      font-size: .62rem;
      border-radius: var(--r-sm);
      background: var(--danger);
      color: #fff
    }

    .nav .plus,
    [data-theme=dark] .nav .plus {
      flex: 0 0 4.15rem;
      width: 4.15rem;
      height: auto;
      min-height: 4.15rem;
      align-self: stretch;
      border-radius: var(--r);
      background: var(--primary);
      color: var(--on-primary);
      display: grid;
      place-items: center;
      pointer-events: auto;

      height: 2.1rem;
      font-size: .72rem
    }

    .aof-ic {
      width: 2.1rem;
      height: 2.1rem;
      display: grid;
      place-items: center;
      color: var(--muted)

    .aof-chg {

      font-weight: 600;
      color: var(--primary);
      padding: .3rem .2rem;

    .aof-b {
      padding: .8rem .9rem .4rem
    }

    .aof-q {
      font-weight: 650;
      font-size: .95rem;
      margin-bottom: .6rem
    }

    .aof-b .search input {
      height: 2.8rem;
      font-size: .95rem
    }

      text-align: left;
      padding: .55rem .1rem;

      border-radius: 0;
      color: var(--ink)

    .aof-cu:last-child {
      border-bottom: 0
    }

    .aof-cu:hover {
      background: var(--surface-2)
    }

    .aof-cu>svg {
      color: var(--faint)
    }

    .aof-cu .or-av {

      height: 2.2rem;
      font-size: .75rem
    }

      align-items: center;
      gap: .6rem;

      text-align: left;
      padding: .6rem .7rem;

      border-radius: var(--r);
      background: var(--primary-50);
      color: var(--primary)
    }

    .aof-add span {
      display: flex;
      flex-direction: column
    }

    .aof-add b {
      font-weight: 650;
      font-size: .92rem
    }

    .aof-add small {
      font-size: .8rem;
      opacity: .85
    }

    .aof-rows {
      display: flex;
      flex-direction: column
    }

    .aof-row {
      display: flex;
      align-items: center;
      gap: .6rem;
      padding: .7rem 0;

      font-size: .98rem

      align-items: center;
      gap: .45rem;
      flex-shrink: 0

      display: inline-flex;
      align-items: center;

      background: var(--surface);

      font-weight: 700;

      background: var(--surface-2);

      flex: 1
    }

    .rate-f span {
      color: var(--muted);
      font-size: .85rem

      outline: 0;

      font-weight: 650;
      color: var(--ink);
      font-family: inherit

      -webkit-appearance: none;
      margin: 0

      border-color: var(--primary)

    }

    .aof-f .btn-secondary {

      flex-direction: column

      background: var(--surface-2)

      margin: 0;
      padding: .55rem 0
    }

      border: 1px solid transparent;
      background: var(--surface-2)
    }

      function trLog(t) {
        if (lang() === 'en') return t;
        let m;
        if ((m = t.match(/^Status → (\w+)$/))) return tr('Status') + ' → ' + tr(m[1]);
        if ((m = t.match(/^Assigned to (.+)$/))) return trText(t);
        if ((m = t.match(/^(₹[\d,]+) (?:advance )?(?:received )?via (\w+)$/))) return m[1] + ' · ' + tr(m[2]);
        if ((m = t.match(/^(Order|Alteration order) created · (₹[\d,]+)$/))) return tr('Order created') + ' · ' + m[2];
        if ((m = t.match(/^(Pickup|Payment|Trial|Delay|Feedback) message sent on WhatsApp$/))) return tr(m[1]) + ' · WhatsApp ' + tr('message sent');
        if ((m = t.match(/^Fitting correction (?:for )?#(\d+)( created)?$/))) return tr('Fitting correction') + ' #' + m[1];
        if ((m = t.match(/^(₹[\d,]+) refunded via (\w+)$/))) return tr('Refund') + ' ' + m[1] + ' · ' + tr(m[2]);
        if ((m = t.match(/^(\d+) photos? added$/))) return trText(t);
        if (t.includes(':')) {
          const head = t.slice(0, t.indexOf(':')), rest = t.slice(t.indexOf(':') + 1).trim();
          return trText(head) + ': ' + rest.split(', ').map(x => x.replace(/^(total|delivery|assigned)/, w => tr({ total: 'Total', delivery: 'Delivery', assigned: 'Assigned to' }[w])).replace(/nobody$/, tr('Not assigned'))).map(x => tr(x)).join(', ');
        }
        return trText(t);

      /* ---------- Reports ---------- */
      function periodRange(p) {
        const t = todayISO(), mk = monthKey(t);
        switch (p) {
          case 'month': return [mk + '-01', t, monthLabel(mk, true)];
          case 'last': { const k = addMonths(mk, -1); return [k + '-01', monthEnd(k), monthLabel(k, true)]; }
          case '6m': return [addMonths(mk, -5) + '-01', t, 'Last 6 months'];
          case 'year': return [t.slice(0, 4) + '-01-01', t, 'This year'];
          default: return ['0000-01-01', '9999-12-31', 'All time'];
        }
      }
      function niceMax(m) { if (m <= 0) return 1; const p = Math.pow(10, Math.floor(Math.log10(m))); for (const s of [1, 2, 2.5, 5, 10]) if (s * p >= m) return s * p; return 10 * p; }
      function roundTop(x, y, w, h, r) { if (h <= 0) return ''; r = Math.min(r, h, w / 2); return 'M' + x + ',' + (y + h) + 'V' + (y + r) + 'Q' + x + ',' + y + ' ' + (x + r) + ',' + y + 'H' + (x + w - r) + 'Q' + (x + w) + ',' + y + ' ' + (x + w) + ',' + (y + r) + 'V' + (y + h) + 'Z'; }
      function groupedBars(data) {
        const W = 340, H = 190, pl = 40, pr = 4, pt = 10, pb = 26, ih = H - pt - pb;
        const max = niceMax(Math.max(1, ...data.flatMap(d => [d.a, d.b])));
        const cw = (W - pl - pr) / data.length, bw = Math.min(16, (cw - 14) / 2);
        const y = v => pt + ih - (v / max) * ih;
        let g = '';
        [0, .5, 1].forEach(f => { const yy = y(max * f); g += '<line class="gridline" x1="' + pl + '" x2="' + (W - pr) + '" y1="' + yy + '" y2="' + yy + '"/><text class="axis-t" x="' + (pl - 6) + '" y="' + (yy + 3) + '" text-anchor="end">' + moneyK(max * f) + '</text>'; });
        data.forEach((d, i) => {
          const cx = pl + i * cw + cw / 2, x1 = cx - bw - 1, x2 = cx + 1;
          g += '<path d="' + roundTop(x1, y(d.a), bw, pt + ih - y(d.a), 4) + '" fill="var(--c1)"/>';
          g += '<path d="' + roundTop(x2, y(d.b), bw, pt + ih - y(d.b), 4) + '" fill="var(--c2)"/>';
          g += '<text class="axis-x" x="' + cx + '" y="' + (H - 8) + '" text-anchor="middle">' + esc(d.label) + '</text>';
          g += '<rect class="hit" x="' + (pl + i * cw) + '" y="' + pt + '" width="' + cw + '" height="' + ih + '" fill="transparent" rx="6" data-tip="' + esc(d.long) + '|' + d.a + '|' + d.b + '" tabindex="0"/>';
        });
        g += '<line x1="' + pl + '" x2="' + (W - pr) + '" y1="' + (pt + ih) + '" y2="' + (pt + ih) + '" stroke="var(--faint)" stroke-width="1"/>';
        return '<div class="chart-wrap"><svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Money in and out by month">' + g + '</svg><div class="tip"></div></div>';
      }
      function hbars(rows, color, fmt) {
        if (!rows.length) return '<p class="muted" style="font-size:0.933rem">No data for this period.</p>';
        const max = Math.max(...rows.map(r => r[1]), 1);
        return '<div class="hbars">' + rows.map(r => '<div><div class="hb-top"><span>' + esc(r[0]) + '</span><span>' + (fmt ? fmt(r[1]) : r[1]) + (r[2] ? ' · ' + r[2] : '') + '</span></div><div class="hb-track"><div class="hb-fill" style="width:' + (r[1] / max * 100) + '%;background:' + color + '"></div></div></div>').join('') + '</div>';

        'ai-clear': () => { if (AI.ctrl) try { AI.ctrl.abort(); } catch (e) { } AI.msgs = []; AI.busy = false; aiDraw(); },

        'ai-pickc': el => { const c = aiCardRef(el.dataset.m, el.dataset.p); if (!c) return; c.done = el.dataset.id; aiContinue(c.purpose, el.dataset.id); },
        'ai-newcust': el => {
          const c = aiCardRef(el.dataset.m, el.dataset.p); const q = c && c.query ? c.query.trim() : ''; const ph = (q.match(/\d{10}/) || [''])[0];

        'ai-clothes-next': el => {
          const c = aiCardRef(el.dataset.m, el.dataset.p); if (!c) return; const items = Object.entries(c.qty).filter(([, n]) => n > 0).map(([type, qty]) => ({ type, qty })); if (!items.length) return;

        'ai-order-for': el => { aiPush(tr('Set the clothes and rate.'), [aofNew({ customerId: el.dataset.c })]); },
        'ai-pickstaff': el => { const c = aiCardRef(el.dataset.m, el.dataset.p); if (!c) return; c.done = el.dataset.id; const qty = {}; S.garments.forEach(g => { qty[g.name] = 0; }); aiPush(tr('How many pieces?'), [{ kind: 'workQty', staffId: el.dataset.id, qty, back: 0 }]); },
        'ai-wqty': el => { const c = aiCardRef(el.dataset.m, el.dataset.p); if (!c) return; c.qty[el.dataset.g] = Math.max(0, Math.min(500, (c.qty[el.dataset.g] || 0) + (+el.dataset.d))); aiDraw(); },

        'ai-mode': el => { const c = aiCardRef(el.dataset.m, el.dataset.p); if (!c) return; c.mode = el.dataset.v; aiDraw(); },
        'ai-edit-clothes': el => { const c = aiCardRef(el.dataset.m, el.dataset.p); if (!c) return; const m = AI.msgs[+el.dataset.m]; m.cards = m.cards.filter(x => x !== c); aiPush(tr('Change clothes or rate'), [aiClothesCard(c.customerId, c.items)]); },
        'ai-create': el => {
          const c = aiCardRef(el.dataset.m, el.dataset.p); if (!c || c.done) return; const r = aiCreateOrder(c);
          if (typeof r === 'string') { c.err = r; aiDraw(); return; } c.done = r.id; c.err = ''; toast(tr('Order') + ' #' + r.no + ' ' + tr('created')); aiDraw();
        },
        'ai-full-form': el => { const c = aiCardRef(el.dataset.m, el.dataset.p); if (!c) return; aiClose(); setTimeout(() => orderForm(null, { customer: c.customerId, items: c.items.map(i => ({ type: i.type, qty: i.qty, price: i.price, styles: {}, note: i.note || '', photos: [] })) }), 80); },
        'ai-open-order': el => { aiClose(); go('order', { id: el.dataset.id }); },
        'aof-pick': el => { const c = aiCardRef(el.dataset.m, el.dataset.p); if (!c) return; c.customerId = el.dataset.id; c.nc = null; c.err = ''; c.step = aofReady(c) && aofSel(c).length && c.wasDetails ? 'details' : 'clothes'; aiDraw(); aofFocus(c); },
        'aof-addnew': el => {
          const c = aiCardRef(el.dataset.m, el.dataset.p); if (!c) return; const q = String(c.query || '').trim(), ph = (q.match(/\d{10}/) || [''])[0];
          c.nc = { name: ph ? '' : q.replace(/\b\w/g, m => m.toUpperCase()), phone: ph, book: nextBookNo() }; c.err = ''; aiDraw(); setTimeout(() => { const i = $('#aof-' + c.id + ' .aof-nc[data-f=' + (c.nc.name ? 'phone' : 'name') + ']'); if (i) i.focus(); }, 40);
        },
        'aof-nc-cancel': el => { const c = aiCardRef(el.dataset.m, el.dataset.p); if (!c) return; c.nc = null; c.err = ''; aiDraw(); },
        'aof-nc-save': el => { const c = aiCardRef(el.dataset.m, el.dataset.p); if (c) aofSaveNc(c); },
        'aof-goto': el => { const c = aiCardRef(el.dataset.m, el.dataset.p); if (!c) return; if (c.step === 'details') c.wasDetails = true; c.step = el.dataset.s; c.err = ''; aiDraw(); aofFocus(c); },
        'aof-qty': el => {
          const c = aiCardRef(el.dataset.m, el.dataset.p); if (!c) return; const g = el.dataset.g, was = c.qty[g] || 0; c.qty[g] = Math.max(0, Math.min(50, was + (+el.dataset.d))); aiDraw();
          if (!was && c.qty[g]) { const i = $('#aof-' + c.id + ' .aof-rate[data-g="' + g + '"]'); if (i && !i.value) i.focus(); }
        },
        'aof-next': el => { const c = aiCardRef(el.dataset.m, el.dataset.p); if (!c) return; if (!aofReady(c)) { c.err = tr('Enter the rate for each cloth.'); aiDraw(); return; } c.err = ''; c.step = 'details'; aiDraw(); aofFocus(c); },
        'aof-days': el => { const c = aiCardRef(el.dataset.m, el.dataset.p); if (!c) return; c.days = +el.dataset.n; c.due = addDays(todayISO(), c.days); aiDraw(); },
        'aof-mode': el => { const c = aiCardRef(el.dataset.m, el.dataset.p); if (!c) return; c.mode = el.dataset.v; aiDraw(); },
        'aof-create': el => {
          const c = aiCardRef(el.dataset.m, el.dataset.p); if (!c || c.step === 'done') return; const r = aiCreateOrder(Object.assign({}, c, { items: aofItems(c) }));
          if (typeof r === 'string') { c.err = r; aiDraw(); return; } c.orderId = r.id; c.step = 'done'; c.err = ''; toast(tr('Order') + ' #' + r.no + ' ' + tr('created')); aiDraw(); aofFocus(c);
        },
        'aof-full': el => { const c = aiCardRef(el.dataset.m, el.dataset.p); if (!c) return; aiClose(); setTimeout(() => orderForm(null, { customer: c.customerId, items: aofItems(c).map(i => Object.assign(i, { styles: {}, photos: [] })) }), 80); },
        'aof-again': () => { AI.stick = true; aiPush(tr('Next order — pick the customer.'), [aofNew()]); },
        'settings': () => go('settings'),
        'toggle-dark': () => { S.settings.theme = isDark() ? 'light' : 'dark'; save(); applyTheme(); render(false); },
        'set-theme': el => { S.settings.theme = el.dataset.t || el.dataset.v; save(); applyTheme(); render(false); },
        'set-pin': () => pinForm(),
        'remove-pin': () => confirmDlg('Turn off PIN?', 'Anyone with this phone will be able to open the app.', 'Turn off PIN', () => { S.settings.pin = ''; commit('PIN turned off'); }),
        'lock-now': () => { if (S.settings.pin) showLock(); },
        'backup-copy': async () => { const ok = await copyText(JSON.stringify(S)); toast(ok ? 'Backup copied — paste it in WhatsApp or email to keep it safe' : 'Couldn’t copy on this device', null, ok ? 'check' : 'alert'); },
        'restore-open': () => restoreSheet(),
        'restore-file': () => { $('#restorePick').click(); },
        'restore-apply': () => { const t = ($('#restoreText') || {}).value || ''; if (!t.trim()) { const e = $('#restoreErr'); e.textContent = 'Paste your backup text first.'; e.classList.add('show'); return; } applyRestore(t); },
        'load-sample': () => confirmDlg('Load sample data?', 'This replaces everything with demo customers, orders, staff and expenses.', 'Load sample data', () => { const th = S.settings.theme, pin = S.settings.pin; S = seed(); S.settings.theme = th; S.settings.pin = pin; resetUI(); save(); setTab('home'); toast('Sample data loaded'); }, 'btn-primary'),
        'erase-all': () => confirmDlg('Erase all data?', 'All customers, orders, measurements, staff, expenses and stock will be permanently deleted.', 'Erase everything', () => { S = emptyData(); resetUI(); save(); setTab('home'); toast('All data erased'); })
      };
      function resetUI() { Object.assign(UI, { orderFilter: 'Active', orderSearch: '', customerSearch: '', invSearch: '', invFilter: 'All', sort: 'due', tagFilter: '', staffFilter: '', custFilter: 'All', selecting: false, sel: new Set() }); }

      document.addEventListener('click', e => {
        const el = e.target.closest('[data-act]');
        if (!el || el.disabled) return;
        if (UI.locked && !el.closest('#dialog')) return;
        const fn = A[el.dataset.act];
        if (fn) { if (el.tagName !== 'A') e.preventDefault(); fn(el, e); }
      });
      document.addEventListener('change', e => {
        const el = e.target.closest('[data-change]'); if (!el) return;
        if (el.dataset.change === 'todo-toggle') { const x = (S.todos || []).find(t => t.id === el.dataset.id); if (x) { x.done = el.checked; save(); setTimeout(() => render(false), 150); } return; }
        if (el.dataset.change === 'qc') { const o = curOrder(); if (!o) return; o.qc = o.qc || {}; o.qc[el.dataset.k] = el.checked; if (qcDone(o) === QC_ITEMS.length) logOrder(o, 'Quality check completed'); save(); render(false); return; }
        if (el.dataset.change === 'set-status') { const o = curOrder(); if (!o) return; const v = el.value; el.value = o.status; setStatus(o, v); return; }
        if (el.dataset.change === 'offday') { S.settings.offDay = +el.value; commit(tr('Weekly holiday saved')); return; }
        if (el.dataset.change === 'assign-staff') { const o = curOrder(); if (!o) return; o.staffId = el.value; const s = staffBy(el.value); logOrder(o, s ? 'Assigned to ' + s.name : 'Unassigned'); commit(s ? 'Assigned to ' + s.name : 'Unassigned'); }
      });
      document.addEventListener('keydown', e => {
        if (e.key !== 'Enter' || !e.target.matches || !e.target.matches('#mfFields input')) return;
        e.preventDefault(); const ins = $$('#mfFields input'), i = ins.indexOf(e.target);
        if (i < ins.length - 1) { ins[i + 1].focus(); ins[i + 1].select && ins[i + 1].select(); } else { const b = $('#measForm [type=submit]'); if (b) b.click(); }
      });
      document.addEventListener('input', e => {
        const k = e.target.dataset && e.target.dataset.input; if (!k) return;
        if (k === 'order-search') { UI.orderSearch = e.target.value; UI.orderLimit = 40; renderOrderList(); }
        if (k === 'customer-search') { UI.customerSearch = e.target.value; renderCustomerList(); }
      });
      document.addEventListener('submit', e => {
        if (e.target.classList.contains('gf-add')) {
          e.preventDefault(); const g = S.garments.find(x => x.name === e.target.dataset.g); if (!g) return; const inp = e.target.elements.fname, er = $$('[data-gerr]').find(x => x.dataset.gerr === g.name); const r = addField(g, inp.value);
          if (r.err) { if (er) { er.textContent = r.err; er.classList.add('show'); } inp.focus(); return; } save(); render(false); toast(tr('Field added') + ' · ' + tr(g.name)); return;
        }
        if (e.target.id === 'todoForm') { e.preventDefault(); const inp = e.target.elements.todo, v = inp.value.trim().replace(/\s+/g, ' '); if (!v) { inp.focus(); return; } S.todos = S.todos || []; S.todos.push({ id: uid('t'), text: v.slice(0, 80), done: false, created: new Date().toISOString() }); save(); render(false); const n = $('#todoForm input'); if (n) n.focus(); return; }
        if (e.target.id !== 'settingsForm') return;
        e.preventDefault(); const f = e.target; clearErrs(f); let ok = true;
        const name = f.elements.shopName.value.trim().replace(/\s+/g, ' '), raw = f.elements.phone.value.trim(), ph = cleanPhone(raw);
        if (name.length < 2) { setErr(f, 'shopName', tr('Enter your shop name.')); ok = false; }
        if (raw && !/^\d{10}$/.test(ph)) { setErr(f, 'phone', tr('Enter a 10-digit number or leave blank.')); ok = false; }
        const upi = f.elements.upi.value.trim(), gstin = f.elements.gstin.value.trim().toUpperCase();
        if (upi && !/^[\w.\-]{2,}@[A-Za-z][A-Za-z0-9]{1,}$/.test(upi)) { setErr(f, 'upi', tr('Enter a UPI ID like name@okaxis.')); ok = false; }
        if (gstin && !/^\d{2}[A-Z]{5}\d{4}[A-Z][1-9A-Z]Z[0-9A-Z]$/.test(gstin)) { setErr(f, 'gstin', tr('GSTIN should be 15 characters, e.g. 24ABCDE1234F1Z5.')); ok = false; }
        if (!ok) { focusFirstErr(f); return; }
        S.settings.shopName = name; S.settings.phone = raw ? ph : ''; S.settings.upi = upi; S.settings.gstin = gstin; commit(tr('Shop details saved'));
      });
      // chart tooltips
      function showTip(el) {
        const wrap = el.closest('.chart-wrap'); if (!wrap) return; const tip = $('.tip', wrap), [lab, a, b] = el.dataset.tip.split('|');
        tip.innerHTML = '<b>' + lab + '</b><div><i style="background:var(--c1)"></i>' + tr('Collected') + ' ' + money(a) + '</div><div><i style="background:var(--c2)"></i>' + tr('Spent') + ' ' + money(b) + '</div><div style="margin-top:3px;opacity:.75">' + tr('Net') + ' ' + money(a - b) + '</div>';
        const wr = wrap.getBoundingClientRect(), r = el.getBoundingClientRect();
        let x = r.left - wr.left + r.width / 2; x = Math.max(70, Math.min(wr.width - 70, x));
        tip.style.left = x + 'px'; tip.style.top = (r.top - wr.top + 4) + 'px'; tip.classList.add('show');
      }
      document.addEventListener('pointerover', e => { const h = e.target.closest && e.target.closest('.hit'); if (h) showTip(h); });
      document.addEventListener('pointerout', e => { const h = e.target.closest && e.target.closest('.hit'); if (h) { const t = h.closest('.chart-wrap') && $('.tip', h.closest('.chart-wrap')); if (t) t.classList.remove('show'); } });
      document.addEventListener('focusin', e => { if (e.target.classList && e.target.classList.contains('hit')) showTip(e.target); });
      document.addEventListener('click', e => { const h = e.target.closest && e.target.closest('.hit'); if (h) showTip(h); });
      document.addEventListener('keydown', e => {
        if (e.key !== 'Escape') return;
        if ($('#dialog').classList.contains('open')) closeDialog();
        else if ($('#lightbox').classList.contains('open')) { $('#lightbox').classList.remove('open'); LB = null; }
        else if ($('#searchWrap').classList.contains('open')) closeSearch();
        else if ($('#sheetWrap').classList.contains('open')) closeSheet();
      });
      window.addEventListener('scroll', () => $('#topbar').classList.toggle('scrolled', window.scrollY > 4), { passive: true });
      if (window.matchMedia) try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (S.settings.theme === 'auto') { applyTheme(); render(false); } }); } catch (e) { }

      /* =========================================================
         BOOT
         ========================================================= */
      $('#sheetClose').innerHTML = icon('x', 22);
      (() => {
        const sh = $('.sheet'); let y0 = null, dy = 0;
        const start = e => { if (window.innerWidth >= 640) return; y0 = (e.touches ? e.touches[0] : e).clientY; dy = 0; sh.classList.add('dragging'); sh.classList.remove('settle'); };
        const move = e => { if (y0 == null) return; dy = Math.max(0, (e.touches ? e.touches[0] : e).clientY - y0); sh.style.transform = 'translateY(' + dy + 'px)'; };
        const end = () => {
          if (y0 == null) return; y0 = null; sh.classList.remove('dragging'); sh.classList.add('settle');
          if (dy > 110) { sh.style.transform = 'translateY(100%)'; setTimeout(() => { closeSheet(); sh.style.transform = ''; sh.classList.remove('settle'); }, 200); } else { sh.style.transform = ''; }
        };
        ['#sheetGrab', '.sheet-head'].forEach(sel => { const el = $(sel); el.addEventListener('touchstart', e => { if (e.target.closest('button')) return; start(e); }, { passive: true }); });
        document.addEventListener('touchmove', move, { passive: true }); document.addEventListener('touchend', end);
      })();
      $('#swBack').innerHTML = icon('back', 22);
      $('#csvPick').addEventListener('change', e => { const f = e.target.files && e.target.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => importCustomers(String(r.result)); r.readAsText(f); });
      S = load(); if (!S) { S = seed(); S.settings.setupDone = false; }
      trObserver.observe(document.body, { childList: true, subtree: true });
      save(); applyTheme(); render(true); translateTree(document.body);
      if (!S.settings.setupDone) showWizard(); else if (S.settings.pin) showLock();
      showSplash();
      window.__app = { get S() { return S; }, UI, get blocked() { return Date.now() < clickBlockUntil; }, daySummaryText, jobText, measureText };
      $('#wiz').addEventListener('click', obClick);
    })();
  </script>
